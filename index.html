<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADsP OX 퀴즈</title>
<meta name="description" content="ADsP 1~3과목 OX 퀴즈 500문항 · 무료 학습자료와 32~50회 기출 복원문제 기반 · Ⓒ 꿈꾸는라이언">
<meta property="og:type" content="website">
<meta property="og:title" content="ADsP OX 퀴즈 (1~3과목 500문항)">
<meta property="og:description" content="과목별 OX 퀴즈로 핵심 개념을 빠르게 점검하세요. 틀린 문제만 다시 풀기 지원 · Ⓒ 꿈꾸는라이언">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%AD%95%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7fb; --card:#ffffff; --ink:#1f2933; --sub:#5e6b78; --line:#e3e7ee;
  --accent:#2f6fdb; --accent-soft:#e8f0ff;
  --ok:#1f9d57; --ok-soft:#e3f7ea; --ng:#e0473c; --ng-soft:#fde9e7;
  --o:#2f6fdb; --x:#e0473c; --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14181f; --card:#1d232c; --ink:#e8edf3; --sub:#9aa7b4; --line:#2c3440;
    --accent:#7aa7ff; --accent-soft:#1f2c45; --ok:#4cc985; --ok-soft:#173326; --ng:#ff7b70; --ng-soft:#3a1d1b;
    --o:#7aa7ff; --x:#ff7b70; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#14181f; --card:#1d232c; --ink:#e8edf3; --sub:#9aa7b4; --line:#2c3440;
  --accent:#7aa7ff; --accent-soft:#1f2c45; --ok:#4cc985; --ok-soft:#173326; --ng:#ff7b70; --ng-soft:#3a1d1b;
  --o:#7aa7ff; --x:#ff7b70; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 80px}
header.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);margin-bottom:6px}
header.top b{color:var(--accent)}
h1{font-size:28px;font-weight:900;margin:4px 0 6px;letter-spacing:-.5px}
.lead{color:var(--sub);font-size:14.5px;margin:0 0 16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.score{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.score .big{font-size:26px;font-weight:900;color:var(--accent)}
.score .lbl{font-size:12.5px;color:var(--sub)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:12px;display:flex}
.bar i{display:block;height:100%}
.bar .b-ok{background:var(--ok)} .bar .b-ng{background:var(--ng)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 12px;font-size:13.5px;font-family:inherit;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip .dot{width:10px;height:10px;border-radius:50%}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip small{opacity:.75}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:13.5px;font-family:inherit;cursor:pointer}
.btn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:700}
.btn:focus-visible,.chip:focus-visible,.ox:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.unit-head{display:flex;align-items:center;gap:10px;margin:26px 0 10px}
.unit-head .tag{font-weight:900;font-size:13px;color:#1f2933;padding:4px 10px;border-radius:8px}
.unit-head h2{font-size:18px;margin:0;font-weight:800}
.unit-head .cnt{margin-left:auto;font-size:12.5px;color:var(--sub)}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;margin-bottom:10px;box-shadow:var(--shadow);border-left:6px solid var(--line)}
.q.ok{border-left-color:var(--ok)} .q.ng{border-left-color:var(--ng)}
.q .row{display:flex;gap:12px;align-items:flex-start}
.q .num{font-weight:900;color:var(--accent);min-width:34px;font-size:15px;padding-top:1px}
.q .stmt{flex:1;font-size:15.5px;font-weight:500;word-break:keep-all;overflow-wrap:anywhere}
.q .btns{display:flex;gap:8px;margin:12px 0 0 46px}
.ox{width:64px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:22px;font-weight:900;cursor:pointer;font-family:inherit;line-height:1}
.ox.o{color:var(--o)} .ox.x{color:var(--x)}
.ox:hover:not([disabled]){border-color:currentColor}
.ox.picked{color:#fff}
.ox.o.picked{background:var(--o);border-color:var(--o)} .ox.x.picked{background:var(--x);border-color:var(--x)}
.ox[disabled]{cursor:default}
.ox.answer:not(.picked){border-color:currentColor;border-style:dashed}
.fb{margin:10px 0 0 46px;padding:10px 12px;border-radius:10px;font-size:14px;display:none}
.fb.show{display:block}
.q.ok .fb{background:var(--ok-soft)} .q.ng .fb{background:var(--ng-soft)} .q.rev .fb{background:var(--accent-soft)}
.fb .verdict{font-weight:800;margin-right:6px}
.q.ok .verdict{color:var(--ok)} .q.ng .verdict{color:var(--ng)} .q.rev .verdict{color:var(--accent)}
.fb .src{display:inline-block;margin-top:4px;font-size:12px;color:var(--sub)}
.subj{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:0 0 14px}
.subj button{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 14px;text-align:left;font-family:inherit;cursor:pointer}
.subj button b{display:block;font-size:17px;font-weight:900}
.subj button span{font-size:12.5px;color:var(--sub)}
.subj button.on{border-color:var(--accent);background:var(--accent-soft)}
.subj button.on b{color:var(--accent)}
.subj button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.empty{text-align:center;color:var(--sub);padding:30px 0}
footer{color:var(--sub);font-size:12px;text-align:center;margin-top:30px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin-top:12px}
.grid div{font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;display:flex;justify-content:space-between}
.grid b{font-weight:800}
@media (max-width:520px){
  h1{font-size:23px}
  .q .btns,.fb{margin-left:0}
  .q .num{min-width:28px}
  .ox{flex:1}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><span>ADsP 시험 대비 복습</span><span>Ⓒ <b>꿈꾸는라이언</b></span></header>
  <h1>과목별 · 단원별 OX 퀴즈</h1>
  <p class="lead">무료 학습자료와 32~50회 기출을 바탕으로 만든 복습용 OX 퀴즈예요. 과목을 고르고 O 또는 X를 누르면 바로 정답과 해설이 나와요. 푼 기록은 이 기기에 저장돼요.</p>
  <nav class="subj" id="subj" aria-label="과목 선택"></nav>

  <section class="panel" aria-label="점수">
    <div class="score">
      <div><div class="big" id="sCorrect">0</div><div class="lbl">맞힌 문제</div></div>
      <div><div class="big" id="sDone" style="color:var(--ink)">0</div><div class="lbl">푼 문제 / <span id="sTotal">100</span></div></div>
      <div><div class="big" id="sRate" style="color:var(--ok)">–</div><div class="lbl">정답률</div></div>
    </div>
    <div class="bar"><i class="b-ok" id="bOk" style="width:0"></i><i class="b-ng" id="bNg" style="width:0"></i></div>
  </section>

  <section class="panel" aria-label="필터">
    <div class="tools">
      <button class="btn" id="tWrong" aria-pressed="false">틀린 문제만</button>
      <button class="btn" id="tTodo" aria-pressed="false">안 푼 문제만</button>
      <button class="btn" id="tReview" aria-pressed="false">정답·해설 모두 보기</button>
      <button class="btn" id="tShuffle" aria-pressed="false">순서 섞기</button>
      <button class="btn" id="tReset">현재 단원 다시 풀기</button>
    </div>
  </section>

  <main id="list"></main>
  <footer>본 자료는 꿈꾸는라이언 ADsP 요약노트, 무료 학습자료 및 32~50회 기출 복원문제를 바탕으로 제작되었습니다. Ⓒ 꿈꾸는라이언</footer>
</div>
<script>
const SUBJ = [{"no": 1, "title": "데이터 이해", "units": [{"no": 1, "title": "데이터의 개념과 유형", "color": "#FFF59D"}, {"no": 2, "title": "지식 경영 : DIKW와 SECI", "color": "#FDE3C0"}, {"no": 3, "title": "데이터베이스와 DBMS", "color": "#FFCFA0"}, {"no": 4, "title": "기업 내부 DB 솔루션", "color": "#F9B1A8"}, {"no": 5, "title": "빅데이터의 이해", "color": "#BDECA8"}, {"no": 6, "title": "빅데이터 처리 기술", "color": "#A9F0DA"}, {"no": 7, "title": "빅데이터 활용 기법", "color": "#B6E4F2"}, {"no": 8, "title": "빅데이터 위기 요인과 통제 방안", "color": "#D5C2FF"}, {"no": 9, "title": "데이터 사이언스와 사이언티스트", "color": "#FFBCD3"}]}, {"no": 2, "title": "데이터 분석 기획", "units": [{"no": 1, "title": "분석 기획 개요", "color": "#FFF59D"}, {"no": 2, "title": "분석 방법론 : KDD · CRISP-DM", "color": "#FDE3C0"}, {"no": 3, "title": "빅데이터 분석 방법론", "color": "#FFCFA0"}, {"no": 4, "title": "분석 과제 도출 : 하향식 · 상향식", "color": "#F9B1A8"}, {"no": 5, "title": "분석 프로젝트 관리", "color": "#BDECA8"}, {"no": 6, "title": "분석 마스터플랜과 우선순위", "color": "#A9F0DA"}, {"no": 7, "title": "분석 거버넌스 체계와 조직", "color": "#B6E4F2"}, {"no": 8, "title": "데이터 거버넌스", "color": "#D5C2FF"}, {"no": 9, "title": "분석 수준 진단 : 준비도와 성숙도", "color": "#FFBCD3"}]}, {"no": 3, "title": "데이터 분석", "units": [{"no": 1, "title": "결측값과 이상값", "color": "#FFF59D"}, {"no": 2, "title": "탐색적 분석과 상자그림", "color": "#FDE3C0"}, {"no": 3, "title": "척도 · 변수 변환 · 기술통계량", "color": "#FFCFA0"}, {"no": 4, "title": "확률의 기초와 확률분포", "color": "#F9B1A8"}, {"no": 5, "title": "표본추출과 표본오차", "color": "#BDECA8"}, {"no": 6, "title": "표본분포 · 중심극한정리 · 추정", "color": "#A9F0DA"}, {"no": 7, "title": "가설검정", "color": "#B6E4F2"}, {"no": 8, "title": "t검정 · 분산분석 · 카이제곱검정", "color": "#D5C2FF"}, {"no": 9, "title": "상관분석", "color": "#FFBCD3"}, {"no": 10, "title": "회귀분석 기초와 가정", "color": "#E9EE9A"}, {"no": 11, "title": "회귀분석 결과 해석 (R 출력)", "color": "#C8F2E6"}, {"no": 12, "title": "다중공선성과 변수 선택", "color": "#A9C8FF"}, {"no": 13, "title": "주성분분석 (PCA)", "color": "#FFC4F5"}, {"no": 14, "title": "다차원척도법과 거리 척도", "color": "#D9CBB8"}, {"no": 15, "title": "시계열 기초 · 정상성 · 분해", "color": "#C9D6E3"}, {"no": 16, "title": "시계열 모형 : AR · MA · ARIMA", "color": "#FFF59D"}, {"no": 17, "title": "데이터마이닝 개요와 데이터 분할", "color": "#FDE3C0"}, {"no": 18, "title": "로지스틱 회귀", "color": "#FFCFA0"}, {"no": 19, "title": "의사결정나무", "color": "#F9B1A8"}, {"no": 20, "title": "앙상블 · SVM · k-NN", "color": "#BDECA8"}, {"no": 21, "title": "인공신경망", "color": "#A9F0DA"}, {"no": 22, "title": "분류 모형 평가", "color": "#B6E4F2"}, {"no": 23, "title": "계층적 군집", "color": "#D5C2FF"}, {"no": 24, "title": "비계층적 군집", "color": "#FFBCD3"}, {"no": 25, "title": "연관분석", "color": "#E9EE9A"}]}];
const ALL = [{"id": "s1-1", "subj": 1, "n": 1, "unit": 1, "a": "O", "s": "데이터는 '추론과 추정의 근거를 이루는 사실'로 정의된다.", "e": "사전적 정의 그대로예요. 관찰·측정으로 얻은, 아직 가공하지 않은 사실이에요.", "src": "핵심 개념"}, {"id": "s1-2", "subj": 1, "n": 2, "unit": 1, "a": "X", "s": "데이터의 존재적 특성이란 추론·예측·전망·추정을 위한 근거로 기능하는 특성을 말한다.", "e": "이건 당위적 특성이에요. 존재적 특성은 '있는 그대로의 객관적 사실'이에요.", "src": "48회 변형"}, {"id": "s1-3", "subj": 1, "n": 3, "unit": 1, "a": "X", "s": "데이터는 다른 데이터와의 관계보다 개별 데이터 자체로서 더 큰 가치를 가진다.", "e": "데이터의 가치는 다른 데이터와의 상호관계 속에서 생겨요. (단독 < 상호관계)", "src": "36회 변형"}, {"id": "s1-4", "subj": 1, "n": 4, "unit": 1, "a": "X", "s": "습도·기온·체온 데이터는 정성적 데이터에 해당한다.", "e": "숫자로 측정하는 값이므로 정량적 데이터예요.", "src": "46회 변형"}, {"id": "s1-5", "subj": 1, "n": 5, "unit": 1, "a": "O", "s": "정성적 데이터는 주로 비정형이어서 정량적 데이터보다 저장·분석에 더 많은 비용과 기술이 필요하다.", "e": "정성적 = 말·글 위주, 비정형 → 분석 비용↑. 두 유형을 바꿔 쓴 선지가 단골 오답이에요.", "src": "46·48회 변형"}, {"id": "s1-6", "subj": 1, "n": 6, "unit": 1, "a": "O", "s": "같은 날씨 정보라도 '폭염주의보 발령' 같은 기상특보 문구는 정성적 데이터이다.", "e": "기상특보는 문자로 된 정성적 데이터, 풍량·습도·강수량은 정량적 데이터예요.", "src": "42회 변형"}, {"id": "s1-7", "subj": 1, "n": 7, "unit": 1, "a": "X", "s": "HTML은 행과 열로 이루어진 정형 데이터의 대표적인 예이다.", "e": "HTML·XML·JSON은 태그·키로 구조를 표시하는 반정형 데이터예요.", "src": "44회 변형"}, {"id": "s1-8", "subj": 1, "n": 8, "unit": 1, "a": "X", "s": "음성, 동영상, SNS 텍스트는 반정형 데이터에 해당한다.", "e": "정해진 틀이 없는 비정형 데이터예요.", "src": "46회 변형"}, {"id": "s1-9", "subj": 1, "n": 9, "unit": 1, "a": "O", "s": "반정형 데이터는 데이터 안에 메타정보를 포함하고 있어 파싱(Parsing)으로 구조를 해석한다.", "e": "정형 = 스키마 고정(SQL), 반정형 = 메타정보 포함(파싱), 비정형 = 구조 없음이에요.", "src": "37회 변형"}, {"id": "s1-10", "subj": 1, "n": 10, "unit": 1, "a": "X", "s": "바이트(Byte)는 데이터의 최소 단위로, 0 또는 1 중 하나의 값만 가진다.", "e": "최소 단위이면서 0 또는 1의 값을 갖는 것은 비트(Bit)예요. 1 Byte = 8 Bit예요.", "src": "50회 변형"}, {"id": "s1-11", "subj": 1, "n": 11, "unit": 1, "a": "O", "s": "1 ZB(제타바이트)는 1,024 EB(엑사바이트)와 같다.", "e": "용량 단위는 한 칸마다 ×1,024예요. 킬·메·기·테 / 페·엑·제·요 순서예요.", "src": "44회 변형"}, {"id": "s1-12", "subj": 1, "n": 12, "unit": 2, "a": "O", "s": "지식 경영의 핵심은 암묵지와 형식지의 상호작용을 통해 지식을 키우는 것이다.", "e": "암묵지 ↔ 형식지 상호작용을 4단계로 설명한 것이 SECI 모델이에요.", "src": "핵심 개념"}, {"id": "s1-13", "subj": 1, "n": 13, "unit": 2, "a": "X", "s": "암묵지는 문서나 매뉴얼 형태로 겉으로 드러나 있어 다른 사람에게 쉽게 공유할 수 있다.", "e": "문서로 드러나 공유가 쉬운 것은 형식지예요. 암묵지는 무형이라 공유가 어려워요.", "src": "50회 변형"}, {"id": "s1-14", "subj": 1, "n": 14, "unit": 2, "a": "O", "s": "자전거 타기나 음식의 손맛처럼 경험으로 몸에 밴 지식은 암묵지에 해당한다.", "e": "암묵지 = 경험·학습으로 몸에 밴 무형의 지식이에요.", "src": "핵심 개념"}, {"id": "s1-15", "subj": 1, "n": 15, "unit": 2, "a": "X", "s": "공통화(Socialization)는 암묵지를 책이나 교재 같은 형식지로 만드는 과정이다.", "e": "공통화는 암묵 → 암묵(경험 공유)이에요. 암묵 → 형식은 표출화예요.", "src": "39회 변형"}, {"id": "s1-16", "subj": 1, "n": 16, "unit": 2, "a": "O", "s": "개인에게 내재된 경험(암묵지)을 문서나 매체에 저장해 형식지로 바꾸는 과정은 표출화이다.", "e": "표출화(Externalization) = 암묵 → 형식, '밖으로 드러내기'예요.", "src": "36·49회 변형"}, {"id": "s1-17", "subj": 1, "n": 17, "unit": 2, "a": "X", "s": "연결화(Combination)는 기존 형식지에 개인 지식을 더해 새로운 암묵지를 만드는 과정이다.", "e": "연결화는 형식 → 형식이에요. 새 지식을 엮어 새로운 형식지를 만들어요.", "src": "48회 변형"}, {"id": "s1-18", "subj": 1, "n": 18, "unit": 2, "a": "O", "s": "내면화(Internalization)는 만들어진 형식지를 보고 익혀 자신의 암묵지로 체화하는 과정이다.", "e": "내면화 = 형식 → 암묵, '안으로 품기'예요.", "src": "핵심 개념"}, {"id": "s1-19", "subj": 1, "n": 19, "unit": 2, "a": "X", "s": "SECI 모델의 순서는 공통화 → 표출화 → 내면화 → 연결화이다.", "e": "순서는 공통화 → 표출화 → 연결화 → 내면화(공·표·연·내)예요.", "src": "47회 변형"}, {"id": "s1-20", "subj": 1, "n": 20, "unit": 2, "a": "X", "s": "DIKW 피라미드의 I는 Insight(통찰)를 뜻한다.", "e": "I는 Information(정보)이에요. DIKW = Data · Information · Knowledge · Wisdom.", "src": "41·50회 변형"}, {"id": "s1-21", "subj": 1, "n": 21, "unit": 2, "a": "X", "s": "데이터는 축적된 지식과 아이디어가 결합된 창의적인 산물이다.", "e": "창의성은 지혜(Wisdom)의 특징이에요. 데이터는 가공 전의 객관적 사실이에요.", "src": "36·45회 변형"}, {"id": "s1-22", "subj": 1, "n": 22, "unit": 2, "a": "O", "s": "'A마트 연필이 B마트보다 싸다'는 DIKW 중 정보(Information)에 해당한다.", "e": "두 데이터(가격)를 비교해 의미를 도출했으므로 정보예요.", "src": "46회 변형"}, {"id": "s1-23", "subj": 1, "n": 23, "unit": 2, "a": "X", "s": "'다른 상품들도 A마트가 B마트보다 저렴할 것이다'는 DIKW 중 지식(Knowledge)에 해당한다.", "e": "경험하지 않은 다른 대상까지 확장해 추론했으므로 지혜(Wisdom)예요. '연필을 A마트에서 사야겠다'가 지식이에요.", "src": "46회 변형"}, {"id": "s1-24", "subj": 1, "n": 24, "unit": 3, "a": "O", "s": "데이터베이스는 통합 데이터, 저장 데이터, 공용 데이터, 운영 데이터의 네 가지 조건을 갖춘다.", "e": "DB 정의 4요소 = 통합 · 저장 · 공용 · 운영이에요.", "src": "핵심 개념"}, {"id": "s1-25", "subj": 1, "n": 25, "unit": 3, "a": "X", "s": "데이터베이스의 '통합 데이터'란 동일한 내용의 데이터가 여러 곳에 중복 저장된 것을 말한다.", "e": "통합 데이터는 같은 데이터가 중복되지 않는다는 뜻이에요. 그래서 일관성이 유지돼요.", "src": "37·38·39회 변형"}, {"id": "s1-26", "subj": 1, "n": 26, "unit": 3, "a": "X", "s": "데이터베이스의 운영 데이터는 고정된 데이터이므로 변경하거나 삭제할 수 없다.", "e": "운영 데이터는 업무에 맞춰 계속 변경·갱신돼요. (계속적인 변화)", "src": "46·48회 변형"}, {"id": "s1-27", "subj": 1, "n": 27, "unit": 3, "a": "X", "s": "데이터베이스는 레코드의 물리적인 주소를 이용해 데이터를 참조한다.", "e": "주소가 아니라 데이터 값(내용)으로 찾아요. 이것이 '내용에 의한 참조'예요.", "src": "50회 변형"}, {"id": "s1-28", "subj": 1, "n": 28, "unit": 3, "a": "O", "s": "데이터베이스는 여러 사용자가 서로 다른 목적으로 같은 데이터를 동시에 이용할 수 있다.", "e": "DB 4대 특성 중 '동시 공용'이에요. (실시간 접근 · 계속 변화 · 동시 공용 · 내용 참조)", "src": "핵심 개념"}, {"id": "s1-29", "subj": 1, "n": 29, "unit": 3, "a": "O", "s": "기계 가독성, 검색 가능성, 원격 조작성은 데이터베이스의 '정보의 축적 및 전달' 측면에 해당한다.", "e": "'가독성·검색·원격' = 축적·전달 측면, '신속한 획득' = 정보 이용 측면이에요.", "src": "46·47회 변형"}, {"id": "s1-30", "subj": 1, "n": 30, "unit": 3, "a": "X", "s": "데이터베이스는 자료의 종류와 관계없이 항상 2차원 테이블로만 구성된다.", "e": "테이블은 관계형 모델의 형태일 뿐이에요. 객체지향·NoSQL 등 다른 구조도 있어요.", "src": "36·49회 변형"}, {"id": "s1-31", "subj": 1, "n": 31, "unit": 3, "a": "O", "s": "데이터의 일관성과 정확성을 유지하고 검증하는 DBMS의 특징을 무결성이라고 한다.", "e": "무결성 = 데이터가 정확하고 올바른 상태를 유지하는 것이에요.", "src": "45회 변형"}, {"id": "s1-32", "subj": 1, "n": 32, "unit": 3, "a": "X", "s": "DBMS를 도입하면 모든 데이터 문제를 해결할 수 있고, 별도의 유지·보수 비용도 들지 않는다.", "e": "DBMS는 유지·보수 비용과 전문 지식이 필요하고, 장애 시 전체 데이터에 영향을 줄 수 있어요.", "src": "34회 변형"}, {"id": "s1-33", "subj": 1, "n": 33, "unit": 3, "a": "X", "s": "MySQL은 대표적인 NoSQL 데이터베이스이다.", "e": "MySQL은 관계형(RDBMS)이에요. NoSQL 예시는 MongoDB · HBase · Redis · Cassandra예요.", "src": "33회 변형"}, {"id": "s1-34", "subj": 1, "n": 34, "unit": 3, "a": "O", "s": "NoSQL은 'Not Only SQL'의 약자로, 관계형보다 설계가 단순하고 수평적 확장이 쉽다.", "e": "Non-SQL이 아니라 Not Only SQL이에요.", "src": "핵심 개념"}, {"id": "s1-35", "subj": 1, "n": 35, "unit": 3, "a": "O", "s": "메타데이터는 데이터의 특성·구조·정의·관리 정보를 설명하는 '데이터에 대한 데이터'이다.", "e": "메타데이터 = 데이터에 대한 데이터예요. 참고로 빠른 검색·정렬을 위한 자료 구조는 인덱스예요.", "src": "38회 변형"}, {"id": "s1-36", "subj": 1, "n": 36, "unit": 4, "a": "X", "s": "OLAP은 은행 입출금처럼 여러 사용자의 거래를 실시간으로 갱신·처리하는 시스템이다.", "e": "실시간 거래 처리는 OLTP(Transaction)예요. OLAP(Analytical)은 다차원 분석이에요.", "src": "46·47회 변형"}, {"id": "s1-37", "subj": 1, "n": 37, "unit": 4, "a": "O", "s": "OLAP은 지역·기간·상품 등 여러 차원으로 데이터를 대화식으로 분석해 의사결정을 지원한다.", "e": "T = Transaction = 거래·갱신, A = Analytical = 분석·조회로 기억하세요.", "src": "핵심 개념"}, {"id": "s1-38", "subj": 1, "n": 38, "unit": 4, "a": "X", "s": "OLTP는 비정형 데이터만, OLAP은 정형 데이터만 처리한다.", "e": "이런 구분은 없어요. 두 시스템은 목적(거래 처리 vs 분석)으로 구분해요.", "src": "49회 변형"}, {"id": "s1-39", "subj": 1, "n": 39, "unit": 4, "a": "X", "s": "CRM은 원자재 조달부터 생산·물류를 거쳐 소비자에 이르는 공급망 전체를 관리한다.", "e": "공급망 전체를 관리하는 것은 SCM이에요. CRM은 고객관계관리예요.", "src": "38·41회 변형"}, {"id": "s1-40", "subj": 1, "n": 40, "unit": 4, "a": "O", "s": "ERP는 생산·구매·재고·회계·인사 등 기업 내부 자원을 여러 모듈로 통합 관리하는 애플리케이션이다.", "e": "'여러 모듈로 이루어진 통합 애플리케이션' = ERP(전사적 자원관리)예요.", "src": "32·37회 변형"}, {"id": "s1-41", "subj": 1, "n": 41, "unit": 4, "a": "O", "s": "CRM은 고객별 구매 이력 DB를 분석해 개인화 마케팅으로 더 높은 이익을 창출하는 솔루션이다.", "e": "CRM = 고객 이력 DB → 개인화 마케팅이에요.", "src": "39회 변형"}, {"id": "s1-42", "subj": 1, "n": 42, "unit": 4, "a": "O", "s": "데이터 웨어하우스(DW)의 4대 특징은 통합성, 시계열성, 주제 지향성, 비소멸성이다.", "e": "DW = 의사결정 지원용 통합 저장소예요. 배치 작업으로 갱신할 때 외에는 바뀌지 않아요(비소멸성).", "src": "33회 변형"}, {"id": "s1-43", "subj": 1, "n": 43, "unit": 4, "a": "X", "s": "데이터 웨어하우스는 전사적 차원보다 특정 부서의 특정 업무 분야에 초점을 맞춘다.", "e": "이건 데이터 마트(DM)의 설명이에요. DW는 전사적 통합 저장소예요.", "src": "36·37회 변형"}, {"id": "s1-44", "subj": 1, "n": 44, "unit": 4, "a": "X", "s": "ETL은 적재(Load) → 추출(Extract) → 변환(Transform) 순서로 진행된다.", "e": "순서는 추출(E) → 변환(T) → 적재(L)예요.", "src": "핵심 개념"}, {"id": "s1-45", "subj": 1, "n": 45, "unit": 4, "a": "O", "s": "데이터 마트는 특정 부서나 주제에 맞춰 필요한 데이터만 모은 소규모 단일 주제의 데이터 웨어하우스이다.", "e": "DM은 특정 사용자 그룹을 위한 소규모 DW예요.", "src": "34·50회 변형"}, {"id": "s1-46", "subj": 1, "n": 46, "unit": 4, "a": "X", "s": "데이터 웨어하우스와 데이터 마트를 구분하는 기준은 데이터 제공자의 기능과 범위이다.", "e": "구분 기준은 사용자(대상 범위)예요. DW는 전사, DM은 특정 사용자 그룹이에요.", "src": "49회 변형"}, {"id": "s1-47", "subj": 1, "n": 47, "unit": 4, "a": "X", "s": "BI(Business Intelligence)는 통계적·수학적 분석에 초점을 둔, BA보다 진보한 형태이다.", "e": "거꾸로예요. BA가 통계·수학 분석 중심으로 BI보다 진보한 형태예요.", "src": "핵심 개념"}, {"id": "s1-48", "subj": 1, "n": 48, "unit": 4, "a": "O", "s": "특정 요구에 따라 즉석에서 만들어 내는 보고서를 Ad Hoc Report라고 한다.", "e": "BI에서 쓰는 즉석 보고서예요.", "src": "핵심 개념"}, {"id": "s1-49", "subj": 1, "n": 49, "unit": 5, "a": "O", "s": "빅데이터의 3V는 Volume(규모), Variety(다양성), Velocity(속도)이다.", "e": "3V + Value = 4V, 여기에 Veracity를 더하면 5V예요.", "src": "핵심 개념"}, {"id": "s1-50", "subj": 1, "n": 50, "unit": 5, "a": "X", "s": "Veracity(정확성)는 빅데이터의 3V에 포함된다.", "e": "Veracity는 5V로 확장할 때 더해지는 요소예요.", "src": "43회 변형"}, {"id": "s1-51", "subj": 1, "n": 51, "unit": 5, "a": "X", "s": "Availability(가용성)는 빅데이터 4V 중 하나이다.", "e": "4V는 Volume · Variety · Velocity · Value예요. Availability는 V 특징이 아니에요.", "src": "47회 변형"}, {"id": "s1-52", "subj": 1, "n": 52, "unit": 5, "a": "O", "s": "4V에서 추가되는 Value(가치)는 투자 대비 효과(ROI) 같은 비즈니스 효과 관점의 요소이다.", "e": "Value = 비즈니스 효과, ROI와 연결돼요.", "src": "핵심 개념"}, {"id": "s1-53", "subj": 1, "n": 53, "unit": 5, "a": "X", "s": "빅데이터 활용의 3요소는 데이터, 프로세스, 인력이다.", "e": "3요소는 데이터 · 기술 · 인력이에요. 프로세스는 포함되지 않아요.", "src": "32·38·48회 변형"}, {"id": "s1-54", "subj": 1, "n": 54, "unit": 5, "a": "O", "s": "사물인터넷(IoT)과 관련된 '모든 것의 데이터화(Datafication)'는 빅데이터 활용 3요소 중 데이터(자원)에 해당한다.", "e": "데이터 = Datafication, 기술 = 분석 기술·AI, 인력 = 데이터 사이언티스트·알고리즈미스트예요.", "src": "33회 변형"}, {"id": "s1-55", "subj": 1, "n": 55, "unit": 5, "a": "X", "s": "중앙 집중 처리 방식의 발달은 빅데이터의 출현 배경이다.", "e": "출현 배경은 클라우드 컴퓨팅의 분산 병렬처리, 저장장치 가격 하락, 비정형 데이터 확산 등이에요.", "src": "39회 변형"}, {"id": "s1-56", "subj": 1, "n": 56, "unit": 5, "a": "O", "s": "양질 전환 법칙은 데이터의 양적 누적이 어느 순간 질적 비약으로 바뀐다는 생각이다.", "e": "빅데이터 출현 배경과 함께 나오는 개념이에요.", "src": "핵심 개념"}, {"id": "s1-57", "subj": 1, "n": 57, "unit": 5, "a": "X", "s": "빅데이터 시대에는 분석 방식이 전수조사에서 표본조사로 바뀌었다.", "e": "방향이 거꾸로예요. 표본조사 → 전수조사로 바뀌었어요.", "src": "41·42회 변형"}, {"id": "s1-58", "subj": 1, "n": 58, "unit": 5, "a": "O", "s": "빅데이터 시대에는 원인을 밝히지 못하더라도 무엇이 함께 일어나는지를 빠르게 파악하는 상관관계 분석의 중요성이 커졌다.", "e": "인과관계 → 상관관계로의 변화예요.", "src": "50회 변형"}, {"id": "s1-59", "subj": 1, "n": 59, "unit": 5, "a": "X", "s": "빅데이터 시대에는 데이터를 모으기 전에 필요한 정보만 골라 정제하는 사전 처리가 강조된다.", "e": "일단 최대한 모은 뒤 가치를 찾는 사후 처리로 바뀌었어요. (사전 → 사후)", "src": "38·41회 변형"}, {"id": "s1-60", "subj": 1, "n": 60, "unit": 5, "a": "X", "s": "데이터 전문가가 늘어 분석 방법이 일반화된 것은 빅데이터의 가치 산정이 어려운 이유이다.", "e": "가치 산정이 어려운 이유는 활용 방식 다양화 · 새로운 분석 기술 발전 · 새로운 가치 창출이에요.", "src": "34·44회 변형"}, {"id": "s1-61", "subj": 1, "n": 61, "unit": 5, "a": "O", "s": "지금은 쓸모없는 데이터도 새로운 분석 기술로 나중에 가치를 만들 수 있다는 점은 빅데이터 가치 산정을 어렵게 한다.", "e": "'새로운 분석 기술의 발전'에 해당하는 이유예요.", "src": "34·41회 변형"}, {"id": "s1-62", "subj": 1, "n": 62, "unit": 6, "a": "O", "s": "분산 처리는 저렴한 범용 서버 여러 대로 데이터를 나눠 저장·처리하므로 비용을 절감할 수 있다.", "e": "분산 처리의 핵심 장점은 범용 서버 여러 대로 병렬 처리 → 비용 절감이에요.", "src": "50회 변형"}, {"id": "s1-63", "subj": 1, "n": 63, "unit": 6, "a": "O", "s": "하둡(Hadoop)의 핵심 구성 요소는 분산 저장을 담당하는 HDFS와 분산 처리를 담당하는 MapReduce이다.", "e": "HDFS = 저장, MapReduce = 처리예요.", "src": "핵심 개념"}, {"id": "s1-64", "subj": 1, "n": 64, "unit": 6, "a": "X", "s": "HDFS에서 네임노드가 손상되더라도 데이터노드만으로 시스템이 정상 작동한다.", "e": "네임노드는 데이터 위치(메타데이터)를 관리하는 단일 장애점(SPoF)이라, 손상되면 전체가 정상 작동하지 못해요.", "src": "예상문제"}, {"id": "s1-65", "subj": 1, "n": 65, "unit": 6, "a": "X", "s": "HDFS는 하나의 파일을 기본적으로 2개 서버에 복제해 장애에 대비한다.", "e": "복제 기본값은 3개예요.", "src": "예상문제"}, {"id": "s1-66", "subj": 1, "n": 66, "unit": 6, "a": "X", "s": "맵리듀스(MapReduce)는 데이터 처리 과정에서 결측치와 이상치를 자동으로 보정해 품질을 높인다.", "e": "맵리듀스는 분산 병렬 처리 모델이에요. 결측치·이상치 처리는 별도 전처리 작업이에요.", "src": "50회 변형"}, {"id": "s1-67", "subj": 1, "n": 67, "unit": 6, "a": "O", "s": "맵리듀스의 처리 단계는 Input → Splitting → Mapping → Shuffling → Reducing 순서이다.", "e": "Shuffling(같은 키끼리 모으기)은 Mapping과 Reducing 사이에 와요.", "src": "예상문제"}, {"id": "s1-68", "subj": 1, "n": 68, "unit": 6, "a": "X", "s": "스파크(Spark)는 중간 결과를 단계마다 디스크에 읽고 쓰는 디스크 기반 처리 엔진이다.", "e": "디스크 중심은 맵리듀스예요. 스파크는 인메모리(In-Memory) 기반 고속 처리 엔진이에요.", "src": "핵심 개념"}, {"id": "s1-69", "subj": 1, "n": 69, "unit": 6, "a": "O", "s": "스파크는 RDD 구조로 데이터를 분산 관리하며 SQL·실시간 스트리밍·머신러닝을 하나의 엔진에서 처리한다.", "e": "스파크 3대 키워드 = 인메모리 · RDD · 통합 엔진이에요.", "src": "예상문제"}, {"id": "s1-70", "subj": 1, "n": 70, "unit": 6, "a": "X", "s": "JDBC는 HDFS에 저장된 데이터에 SQL 기반 ETL과 대화형 분석을 수행하는 도구이다.", "e": "이건 Tajo(타조)의 설명이에요. JDBC는 자바와 관계형 DB를 연결하는 표준 API예요.", "src": "핵심 개념"}, {"id": "s1-71", "subj": 1, "n": 71, "unit": 7, "a": "O", "s": "기저귀를 사는 고객이 맥주도 함께 사는지를 찾아 진열에 활용하는 것은 연관 분석이다.", "e": "'함께 사는 규칙' = 연관 분석(장바구니 분석)이에요.", "src": "37회 변형"}, {"id": "s1-72", "subj": 1, "n": 72, "unit": 7, "a": "X", "s": "연관 분석은 변수 간의 선형관계를 파악하는 기법이다.", "e": "선형관계는 상관·회귀 분석의 영역이에요. 연관 분석은 함께 일어나는 항목의 규칙을 찾아요.", "src": "47회 변형"}, {"id": "s1-73", "subj": 1, "n": 73, "unit": 7, "a": "O", "s": "'커피를 구매한 고객이 탄산음료도 구매할까?'를 알아보는 데에는 연관 분석이 적합하다.", "e": "함께 구매하는지를 보는 문제이므로 연관 분석이에요.", "src": "44회 변형"}, {"id": "s1-74", "subj": 1, "n": 74, "unit": 7, "a": "X", "s": "위치와 면적으로 아파트 가격을 예측하는 것은 분류 분석의 예이다.", "e": "결과가 연속된 숫자(가격)이므로 회귀 분석이에요.", "src": "46회 변형"}, {"id": "s1-75", "subj": 1, "n": 75, "unit": 7, "a": "O", "s": "광고비 지출액으로 다음 분기 매출액을 예측하는 것은 회귀 분석의 예이다.", "e": "결과가 금액·점수·판매량 같은 숫자면 회귀, 범주면 분류예요.", "src": "50회 변형"}, {"id": "s1-76", "subj": 1, "n": 76, "unit": 7, "a": "X", "s": "고객의 개인 신용 등급을 평가하는 데에는 군집 분석을 활용한다.", "e": "정해진 범주(신용 등급)에 맞히는 것은 분류(유형 분석)예요. 군집은 정답 없이 비슷한 것끼리 묶어요.", "src": "40회 변형"}, {"id": "s1-77", "subj": 1, "n": 77, "unit": 7, "a": "O", "s": "정답 라벨 없이 구매 패턴이 비슷한 고객끼리 몇 개 집단으로 묶는 것은 군집 분석이다.", "e": "군집 = 정답 없이 스스로 묶기(비지도 학습)예요.", "src": "32회 변형"}, {"id": "s1-78", "subj": 1, "n": 78, "unit": 7, "a": "O", "s": "선택·교배·돌연변이를 반복하며 세대를 거쳐 최적의 해를 찾아가는 방법은 유전 알고리즘이다.", "e": "'세대', '최적 조합'이 보이면 유전 알고리즘이에요.", "src": "45·49회 변형"}, {"id": "s1-79", "subj": 1, "n": 79, "unit": 7, "a": "X", "s": "최대 시청률을 얻기 위해 어떤 프로그램을 어느 시간대에 편성할지 최적화하는 데에는 감정 분석이 적합하다.", "e": "최적화 메커니즘을 찾는 문제는 유전 알고리즘이에요.", "src": "35회 변형"}, {"id": "s1-80", "subj": 1, "n": 80, "unit": 7, "a": "X", "s": "구매 고객을 대상으로 한 설문조사는 소셜 네트워크 분석(SNA)의 예이다.", "e": "SNA는 사람들 사이의 연결 관계를 분석해요. 설문조사는 SNA가 아니에요.", "src": "50회 변형"}, {"id": "s1-81", "subj": 1, "n": 81, "unit": 7, "a": "O", "s": "고객 후기를 긍정·부정으로 나누어 서비스 개선에 활용하는 것은 감정 분석이다.", "e": "감정 분석 = 글쓴이의 긍정·부정 감정 분석이에요.", "src": "40회 변형"}, {"id": "s1-82", "subj": 1, "n": 82, "unit": 8, "a": "O", "s": "빅데이터의 3대 위기 요인은 사생활 침해, 책임 원칙 훼손, 데이터 오용이다.", "e": "'기업 경쟁력 약화', '분석 기술의 발달'은 위기 요인이 아니에요.", "src": "42·46회 변형"}, {"id": "s1-83", "subj": 1, "n": 83, "unit": 8, "a": "X", "s": "익명화는 빅데이터의 3대 위기 요인 중 하나이다.", "e": "익명화는 위기 요인이 아니라 사생활 침해를 줄이는 통제 수단이에요.", "src": "38·48회 변형"}, {"id": "s1-84", "subj": 1, "n": 84, "unit": 8, "a": "O", "s": "사생활 침해의 통제 방안은 정보 제공자의 '동의제'에서 정보 사용자의 '책임제'로 전환하는 것이다.", "e": "사생활 침해 → 동의제에서 책임제로 전환이에요.", "src": "36·42회 변형"}, {"id": "s1-85", "subj": 1, "n": 85, "unit": 8, "a": "X", "s": "익명화 기술만으로 빅데이터의 사생활 침해를 완전히 차단할 수 있다.", "e": "여러 정보가 결합되면 재식별될 수 있어 익명화만으로는 불충분해요.", "src": "44·49회 변형"}, {"id": "s1-86", "subj": 1, "n": 86, "unit": 8, "a": "X", "s": "책임 원칙 훼손의 통제 방안은 알고리즘에 대한 접근권을 허용하는 것이다.", "e": "책임 원칙 훼손 → 결과 기반 책임 원칙 고수예요. 알고리즘 접근권은 데이터 오용의 통제 방안이에요.", "src": "33·39회 변형"}, {"id": "s1-87", "subj": 1, "n": 87, "unit": 8, "a": "O", "s": "범죄 예측 결과만으로 실제 범행 전에 용의자를 체포하는 것은 책임 원칙 훼손의 사례이다.", "e": "예측만으로 처벌·불이익을 주는 것이 책임 원칙 훼손이에요.", "src": "핵심 개념"}, {"id": "s1-88", "subj": 1, "n": 88, "unit": 8, "a": "X", "s": "'예측이 아니라 실제 행위의 결과에 따라 책임을 묻는다'는 원칙은 데이터 오용의 통제 방안이다.", "e": "이것은 책임 원칙 훼손의 통제 방안(결과 기반 책임 원칙)이에요.", "src": "47·49회 변형"}, {"id": "s1-89", "subj": 1, "n": 89, "unit": 8, "a": "O", "s": "알고리즈미스트는 알고리즘으로 부당한 피해를 입은 사람을 구제하는 전문가로, 데이터 오용의 통제 방안과 관련된다.", "e": "데이터 오용 → 알고리즘 접근권 허용 · 객관적 인증 · 알고리즈미스트예요.", "src": "35·41회 변형"}, {"id": "s1-90", "subj": 1, "n": 90, "unit": 8, "a": "X", "s": "데이터 마스킹은 개인을 식별할 수 있는 특정 값을 삭제하는 비식별화 기법이다.", "e": "마스킹은 값의 일부를 ***로 가리는 것이에요. 지우는 것은 데이터 삭제예요.", "src": "36·45회 변형"}, {"id": "s1-91", "subj": 1, "n": 91, "unit": 8, "a": "O", "s": "나이 '27세'를 '20대'로 바꾸는 것은 비식별화 기법 중 데이터 범주화에 해당한다.", "e": "범주화 = 구체적인 값을 범위(구간)로 바꾸기예요.", "src": "핵심 개념"}, {"id": "s1-92", "subj": 1, "n": 92, "unit": 8, "a": "O", "s": "총계 처리는 개인의 값 대신 합계나 평균값을 보여 주어 개별 값이 드러나지 않게 하는 기법이다.", "e": "비식별화 5가지 = 가명 · 총계 · 삭제 · 범주화 · 마스킹이에요.", "src": "36회 변형"}, {"id": "s1-93", "subj": 1, "n": 93, "unit": 9, "a": "O", "s": "데이터 사이언스는 정형뿐 아니라 반정형·비정형 데이터까지 다루며 총체적(holistic) 접근법을 사용한다.", "e": "'정형 데이터만을 대상으로 한다'는 선지가 오답으로 나와요.", "src": "36·43회 변형"}, {"id": "s1-94", "subj": 1, "n": 94, "unit": 9, "a": "X", "s": "생성된 데이터로 데이터베이스와 파이프라인을 구축하는 것은 데이터 사이언스의 핵심 역할이다.", "e": "DB·파이프라인 구축은 데이터 엔지니어의 역할이에요.", "src": "44회 변형"}, {"id": "s1-95", "subj": 1, "n": 95, "unit": 9, "a": "X", "s": "알고리즘에 대한 이해·분석 능력은 데이터 사이언티스트의 소프트 스킬에 해당한다.", "e": "이론·기술 지식인 하드 스킬이에요.", "src": "48회 변형"}, {"id": "s1-96", "subj": 1, "n": 96, "unit": 9, "a": "O", "s": "통찰력 있는 분석, 설득력 있는 전달, 다분야 간 협력은 데이터 사이언티스트의 소프트 스킬에 해당한다.", "e": "빅데이터 이론 지식, 분석 기술 숙련은 하드 스킬이에요.", "src": "33·38·41회 변형"}, {"id": "s1-97", "subj": 1, "n": 97, "unit": 9, "a": "X", "s": "데이터 사이언티스트는 분석 정확도가 가장 중요하므로 커뮤니케이션 능력은 상대적으로 중요하지 않다.", "e": "의사소통·스토리텔링 같은 소프트 스킬은 매우 중요해요.", "src": "39·43·47회 변형"}, {"id": "s1-98", "subj": 1, "n": 98, "unit": 9, "a": "X", "s": "가트너가 제시한 데이터 사이언티스트의 역량에는 조직 관리 능력이 포함된다.", "e": "가트너 4대 역량 = 데이터 관리 · 분석 모델링 · 비즈니스 분석 · 소프트 스킬이에요.", "src": "40회 변형"}, {"id": "s1-99", "subj": 1, "n": 99, "unit": 9, "a": "O", "s": "분석 모델은 가정한 범위 밖의 외부 요인은 판단하지 못하므로, 모델의 한계를 끊임없이 고민해야 한다.", "e": "모델의 가정과 현실이 다를 수 있기 때문이에요.", "src": "핵심 개념"}, {"id": "s1-100", "subj": 1, "n": 100, "unit": 9, "a": "X", "s": "빅데이터 가치 패러다임은 Digitalization → Agency → Connection 순서로 변화해 왔다.", "e": "순서는 Digitalization → Connection → Agency예요.", "src": "39·41·43·48회 변형"}, {"id": "s2-1", "subj": 2, "n": 1, "unit": 1, "a": "O", "s": "분석 기획은 실제 분석을 하기 전에 수행할 과제를 정의하고, 그 과제를 어떻게 관리할지 방안을 미리 계획하는 작업이다.", "e": "분석 기획 = 과제 정의 + 관리 방안 사전 계획, 즉 '분석의 설계도'예요.", "src": "핵심 개념"}, {"id": "s2-2", "subj": 2, "n": 2, "unit": 1, "a": "X", "s": "정확도를 높이기 위해 가능한 한 복잡한 분석 모형을 설정하는 것은 분석 기획 단계에서 할 일이다.", "e": "복잡한 모형은 기획 단계의 업무가 아니고, 오히려 과적합 위험을 키워요.", "src": "47회 변형"}, {"id": "s2-3", "subj": 2, "n": 3, "unit": 1, "a": "O", "s": "분석 대상(What)과 분석 방법(How)을 모두 알고 있다면 최적화(Optimization) 유형이다.", "e": "대상 O · 방법 O = 최적화, 이미 아는 방법으로 더 좋게 개선해요.", "src": "40·41회 변형"}, {"id": "s2-4", "subj": 2, "n": 4, "unit": 1, "a": "X", "s": "분석 대상은 명확하지만 분석 방법을 모르는 경우는 통찰(Insight) 유형이다.", "e": "대상 O · 방법 X는 솔루션(Solution)이에요. 통찰은 대상 X · 방법 O예요.", "src": "36·47회 변형"}, {"id": "s2-5", "subj": 2, "n": 5, "unit": 1, "a": "O", "s": "분석 방법은 알지만 분석 대상을 모르는 경우는 통찰(Insight) 유형이다.", "e": "대상 X · 방법 O = 통찰이에요. 솔루션과 바꿔 쓴 선지가 단골이에요.", "src": "39·42·48회 변형"}, {"id": "s2-6", "subj": 2, "n": 6, "unit": 1, "a": "X", "s": "분석 대상과 분석 방법을 모두 모르는 경우는 솔루션(Solution) 유형이다.", "e": "대상 X · 방법 X는 발견(Discovery)이에요.", "src": "41회 변형"}, {"id": "s2-7", "subj": 2, "n": 7, "unit": 1, "a": "X", "s": "과제 중심적 접근(단기)의 1차 목표는 Accuracy & Deploy이다.", "e": "과제 중심적 접근은 Speed & Test예요. Accuracy & Deploy는 마스터 플랜(장기) 접근이에요.", "src": "40회 변형"}, {"id": "s2-8", "subj": 2, "n": 8, "unit": 1, "a": "O", "s": "마스터 플랜 접근은 Long Term View 관점에서 Problem Definition(문제 정의) 방식으로 접근한다.", "e": "장기 = Accuracy & Deploy · Long Term View · Problem Definition이에요.", "src": "핵심 개념"}, {"id": "s2-9", "subj": 2, "n": 9, "unit": 1, "a": "O", "s": "Quick-Win은 단기에 성과를 내기 위해 즉각적으로 실행·추진하는 과제 유형이다.", "e": "과제 중심적 접근(단기)의 과제 유형이에요.", "src": "40회 변형"}, {"id": "s2-10", "subj": 2, "n": 10, "unit": 1, "a": "X", "s": "데이터 정합성 검증은 분석 기획 시 반드시 따져 봐야 할 고려사항이다.", "e": "정합성 검증은 데이터 준비 단계의 일이에요. 기획 고려사항은 가용 데이터 · 유스케이스 · 장애 요소예요.", "src": "44회 변형"}, {"id": "s2-11", "subj": 2, "n": 11, "unit": 1, "a": "O", "s": "기존에 잘 구현된 유사 분석 시나리오와 솔루션을 최대한 활용하는 것은 분석 기획 시 고려사항이다.", "e": "'적절한 유스케이스' 활용이에요. 바퀴를 새로 발명할 필요는 없어요.", "src": "34·38회 변형"}, {"id": "s2-12", "subj": 2, "n": 12, "unit": 2, "a": "X", "s": "폭포수 모델은 반복을 통해 점증적으로 개발하며, 매 반복마다 위험 분석을 수행한다.", "e": "반복 + 위험 분석은 나선형 모델이에요. 폭포수는 선형 순차적인 하향식 모델이에요.", "src": "49회 변형"}, {"id": "s2-13", "subj": 2, "n": 13, "unit": 2, "a": "O", "s": "나선형 모델은 반복에 대한 관리 체계를 효과적으로 갖추지 못하면 복잡도가 상승해 프로젝트 진행이 어려워질 수 있다.", "e": "처음 시도하는 프로젝트에 적용하기 쉽지만, 관리 체계가 없으면 복잡도가 올라가요.", "src": "33·39회 변형"}, {"id": "s2-14", "subj": 2, "n": 14, "unit": 2, "a": "O", "s": "사용자 요구사항이 불분명할 때 일단 시제품을 만들어 보고 결과를 확인하며 개선해 나가는 방식은 프로토타입 모델이다.", "e": "프로토타입 = 시제품 · 상향식 · 요구사항 불분명이에요.", "src": "37회 변형"}, {"id": "s2-15", "subj": 2, "n": 15, "unit": 2, "a": "X", "s": "프로토타입 모델은 한 단계씩 끝내고 다음 단계로 내려가는 선형 순차적 하향식 모델이다.", "e": "이건 폭포수 모델이에요. 프로토타입 모델은 상향식이에요.", "src": "핵심 개념"}, {"id": "s2-16", "subj": 2, "n": 16, "unit": 2, "a": "O", "s": "KDD의 순서는 데이터셋 선택 → 데이터 전처리 → 데이터 변환 → 데이터 마이닝 → 결과 평가이다.", "e": "전처리(정제)가 변환(가공)보다 앞이에요.", "src": "42회 변형"}, {"id": "s2-17", "subj": 2, "n": 17, "unit": 2, "a": "X", "s": "KDD에서 잡음·이상값·결측값을 식별하고 필요하면 제거하는 단계는 데이터 변환이다.", "e": "데이터 전처리 단계예요. 변환은 정규화 · 파생변수 · 차원축소 같은 가공 작업이에요.", "src": "41회 변형"}, {"id": "s2-18", "subj": 2, "n": 18, "unit": 2, "a": "X", "s": "KDD는 소프트웨어 개발 모델의 하나이다.", "e": "KDD는 데이터베이스에서 지식을 찾는 데이터 마이닝 분석 절차예요.", "src": "49회 변형"}, {"id": "s2-19", "subj": 2, "n": 19, "unit": 2, "a": "O", "s": "CRISP-DM의 순서는 업무 이해 → 데이터 이해 → 데이터 준비 → 모델링 → 평가 → 전개이다.", "e": "'업·데·데·모·평·전'으로 외워요.", "src": "46회 변형"}, {"id": "s2-20", "subj": 2, "n": 20, "unit": 2, "a": "X", "s": "CRISP-DM에서 데이터 탐색은 데이터 준비 단계의 태스크이다.", "e": "데이터 탐색은 데이터 이해 단계예요. 데이터 준비는 데이터셋 선택 · 정제 · 통합 · 포맷팅이에요.", "src": "48회 변형"}, {"id": "s2-21", "subj": 2, "n": 21, "unit": 2, "a": "X", "s": "데이터 통합은 CRISP-DM 모델링 단계의 태스크이다.", "e": "데이터 통합은 데이터 준비 단계예요. 모델링은 기법 선택 · 테스트 계획 설계 · 모델 작성 · 모델 평가예요.", "src": "40회 변형"}, {"id": "s2-22", "subj": 2, "n": 22, "unit": 2, "a": "X", "s": "모델 적용성 평가는 CRISP-DM 모델링 단계의 태스크이다.", "e": "모델 적용성 평가는 평가 단계예요('사업적으로 쓸만한가?').", "src": "50회 변형"}, {"id": "s2-23", "subj": 2, "n": 23, "unit": 2, "a": "O", "s": "CRISP-DM에는 KDD에 없는 전개 단계가 있어, 모니터링·유지보수 계획을 수립한다.", "e": "전개 = 전개 계획 · 모니터링/유지보수 계획 · 프로젝트 리뷰예요.", "src": "핵심 개념"}, {"id": "s2-24", "subj": 2, "n": 24, "unit": 3, "a": "O", "s": "빅데이터 분석 방법론은 단계(Phase) – 태스크(Task) – 스텝(Step)의 3계층으로 구성된다.", "e": "단계 ⊃ 태스크 ⊃ 스텝 순서예요.", "src": "33·43회 변형"}, {"id": "s2-25", "subj": 2, "n": 25, "unit": 3, "a": "X", "s": "빅데이터 분석 방법론의 5단계는 데이터 준비 → 분석 기획 → 데이터 분석 → 시스템 구현 → 평가 및 전개 순서이다.", "e": "분석 기획이 맨 앞이에요. 기획 → 준비 → 분석 → 구현 → 평가 및 전개예요.", "src": "32·40회 변형"}, {"id": "s2-26", "subj": 2, "n": 26, "unit": 3, "a": "X", "s": "필요 데이터 정의는 분석 기획 단계의 태스크이다.", "e": "필요 데이터 정의는 데이터 준비 단계예요. 분석 기획은 비즈니스 이해 · 범위 설정, 프로젝트 정의 · 위험 계획 수립이에요.", "src": "33·37회 변형"}, {"id": "s2-27", "subj": 2, "n": 27, "unit": 3, "a": "O", "s": "프로젝트 관계자들의 이해를 일치시키기 위해 고객 요구사항과 예상 결과를 정리한 문서는 SOW(작업 기술서)이다.", "e": "SOW = '무엇을 만드나' 적은 명세서예요.", "src": "32·40회 변형"}, {"id": "s2-28", "subj": 2, "n": 28, "unit": 3, "a": "O", "s": "WBS는 프로젝트 전체 업무를 분류·계획하여 담당자에게 나누어 주는 작업 분할 구조이다.", "e": "WBS = '누가 무슨 일' 하는지 나눈 구조예요.", "src": "핵심 개념"}, {"id": "s2-29", "subj": 2, "n": 29, "unit": 3, "a": "X", "s": "프로젝트 위험 대응 방안에는 회피, 전이, 완화, 관리가 있다.", "e": "위험 대응 4가지는 회피 · 전이 · 완화 · 수용이에요. '관리'나 '제거'는 없어요.", "src": "35·39·41회 변형"}, {"id": "s2-30", "subj": 2, "n": 30, "unit": 3, "a": "O", "s": "탐색적 데이터 분석(EDA)은 시각화와 요약으로 데이터의 숨은 패턴·관계·이상값을 찾아내는 활동이다.", "e": "EDA는 '설계'가 아니라 '관찰하고 이해하기'예요.", "src": "45회 변형"}, {"id": "s2-31", "subj": 2, "n": 31, "unit": 3, "a": "X", "s": "데이터 분석 단계에서 추가 데이터가 필요해지더라도 데이터 준비 단계로 되돌아갈 수 없다.", "e": "추가 데이터가 필요하면 데이터 준비 단계로 되돌아가요(피드백).", "src": "핵심 개념"}, {"id": "s2-32", "subj": 2, "n": 32, "unit": 3, "a": "O", "s": "설계 및 구현, 시스템 테스트 및 운영은 시스템 구현 단계에 속한다.", "e": "시스템 구현 = 설계 및 구현 · 시스템 테스트 및 운영이에요. 단순 분석으로 끝나면 이 단계는 생략해요.", "src": "34회 변형"}, {"id": "s2-33", "subj": 2, "n": 33, "unit": 3, "a": "X", "s": "단순 데이터 분석으로 프로젝트가 끝나더라도 시스템 구현 단계는 반드시 수행해야 한다.", "e": "단순 분석으로 끝나는 경우에는 시스템 구현 단계를 진행하지 않아요.", "src": "핵심 개념"}, {"id": "s2-34", "subj": 2, "n": 34, "unit": 3, "a": "X", "s": "프로젝트의 범위와 일정을 정의하고 계획을 수립하는 것은 평가 및 전개 단계의 일이다.", "e": "맨 앞 분석 기획 단계의 일이에요. 평가 및 전개는 모델 발전 계획 · 프로젝트 평가 및 보고예요.", "src": "49회 변형"}, {"id": "s2-35", "subj": 2, "n": 35, "unit": 4, "a": "O", "s": "하향식 접근은 문제가 확실할 때 체계적인 단계화로 문제를 해결하는 연역적 방식이다.", "e": "하향식 = 문제 확실 · 연역적 · 최적화 · 솔루션이에요.", "src": "35회 변형"}, {"id": "s2-36", "subj": 2, "n": 36, "unit": 4, "a": "X", "s": "상향식 접근은 문제가 명확하게 정의되어 있을 때 사용하는 방식이다.", "e": "상향식은 문제 정의 자체가 어려울 때 데이터부터 탐색하는 방식이에요. '문제 명확'은 하향식이에요.", "src": "42·45회 변형"}, {"id": "s2-37", "subj": 2, "n": 37, "unit": 4, "a": "O", "s": "하향식 접근은 문제 탐색 → 문제 정의 → 해결방안 탐색 → 타당성 검토 순서로 진행한다.", "e": "'탐 · 정 · 해 · 타'로 외워요.", "src": "33·45회 변형"}, {"id": "s2-38", "subj": 2, "n": 38, "unit": 4, "a": "O", "s": "식별된 비즈니스 문제를 데이터 분석 문제로 변환하는 단계는 문제 정의이다.", "e": "예 : '고객이 떠나요' → '이탈할 고객을 데이터로 예측하기'", "src": "34회 변형"}, {"id": "s2-39", "subj": 2, "n": 39, "unit": 4, "a": "X", "s": "하향식 접근의 타당성 검토에서는 경제적·정치적·기술적 타당성을 평가한다.", "e": "타당성 3가지는 경제적 · 데이터 · 기술적 타당성이에요.", "src": "핵심 개념"}, {"id": "s2-40", "subj": 2, "n": 40, "unit": 4, "a": "X", "s": "비즈니스 모델 캔버스 기반 문제 탐색의 5가지 영역에는 '혁신'이 포함된다.", "e": "5가지 영역은 업무 · 제품 · 고객 · 지원 인프라 · 규제/감사예요.", "src": "38회 변형"}, {"id": "s2-41", "subj": 2, "n": 41, "unit": 4, "a": "X", "s": "분석 기회 발굴의 거시적 관점(STEEP)에는 고객이 포함된다.", "e": "STEEP = 사회 · 기술 · 경제 · 환경 · 정치예요. 고객은 시장니즈 탐색 관점이에요.", "src": "32회 변형"}, {"id": "s2-42", "subj": 2, "n": 42, "unit": 4, "a": "X", "s": "데이터 기반 문제 탐색은 하향식 접근의 문제 탐색 기법이다.", "e": "데이터부터 보는 것은 상향식이에요. 하향식 탐색은 비즈니스 모델 · 외부 참조 모델 기반이에요.", "src": "46회 변형"}, {"id": "s2-43", "subj": 2, "n": 43, "unit": 4, "a": "X", "s": "상향식 접근에서는 데이터 분석을 주로 지도 학습 방법으로 수행한다.", "e": "상향식은 정답이 없는 데이터에서 패턴을 찾는 비지도 학습으로 수행해요.", "src": "33·48회 변형"}, {"id": "s2-44", "subj": 2, "n": 44, "unit": 4, "a": "O", "s": "상향식 접근은 반복적인 시행착오로 문제를 도출해 나가는 프로토타이핑 접근법을 활용한다.", "e": "프로토타이핑은 상향식의 방법이에요. 하향식 단계가 아니에요(40회 기출).", "src": "40회 변형"}, {"id": "s2-45", "subj": 2, "n": 45, "unit": 4, "a": "O", "s": "상향식 분석 절차는 프로세스 분류 → 프로세스 흐름 분석 → 분석요건 식별 → 분석요건 정의 순서이다.", "e": "'식별'이 '정의'보다 먼저예요.", "src": "35·44회 변형"}, {"id": "s2-46", "subj": 2, "n": 46, "unit": 4, "a": "O", "s": "디자인 사고에서 상향식 접근은 발산 단계, 하향식 접근은 수렴 단계에 해당한다.", "e": "디자인 사고 = 발산(상향식) + 수렴(하향식) 통합이에요.", "src": "33·37회 변형"}, {"id": "s2-47", "subj": 2, "n": 47, "unit": 4, "a": "O", "s": "상향식 접근은 다양한 원천 데이터로부터 발견(Discovery)을 통해 통찰(Insight)을 얻는 방식이다.", "e": "상향식은 발견 → 통찰로 나아가요.", "src": "37·49회 변형"}, {"id": "s2-48", "subj": 2, "n": 48, "unit": 5, "a": "X", "s": "분석 프로젝트는 처음 수립한 분석 계획을 도중에 변경하지 않고 그대로 완수하는 것이 바람직하다.", "e": "분석 프로젝트는 애자일 방식으로 결과를 보며 범위 · 일정 · 방법을 조정해요.", "src": "50회 변형"}, {"id": "s2-49", "subj": 2, "n": 49, "unit": 5, "a": "O", "s": "분석 과제 정의서에는 소스 데이터, 분석 방법, 데이터 입수 및 분석 난이도, 분석 수행 주기, 분석 결과 검증 등이 담긴다.", "e": "정의서는 목표 달성을 위한 구체적인 방법 · 절차를 담은 설계도예요.", "src": "36·46회 변형"}, {"id": "s2-50", "subj": 2, "n": 50, "unit": 5, "a": "X", "s": "분석 과제 정의서에 기재하는 활용 데이터는 내부 데이터로만 제한해야 한다.", "e": "필요하면 외부 데이터도 활용해요.", "src": "46회 변형"}, {"id": "s2-51", "subj": 2, "n": 51, "unit": 5, "a": "O", "s": "외부 데이터 구매나 분석 툴 도입 시 외부 소싱 계약과 공급업체를 관리하는 관리 영역은 조달이다.", "e": "PoC 프로젝트라면 인프라 구매 대신 클라우드 활용도 검토해요.", "src": "41·43회 변형"}, {"id": "s2-52", "subj": 2, "n": 52, "unit": 5, "a": "O", "s": "분석 과제의 주요 특징 5가지는 데이터 크기, 데이터 복잡성, 속도, 분석 복잡성, 정확도 및 정밀도이다.", "e": "'데이터 분류'는 5가지 특징이 아니에요(42회).", "src": "42회 변형"}, {"id": "s2-53", "subj": 2, "n": 53, "unit": 5, "a": "X", "s": "모델을 반복했을 때의 결과 편차 수준을 정확도(Accuracy)라고 한다.", "e": "반복 시 편차는 정밀도(Precision)예요. 정확도는 실제 값과의 차이예요.", "src": "34회 변형"}, {"id": "s2-54", "subj": 2, "n": 54, "unit": 5, "a": "X", "s": "분석의 안정성 측면에서는 정확도가 정밀도보다 더 중요하다.", "e": "안정성 = 정밀도, 활용 = 정확도예요.", "src": "43·49회 변형"}, {"id": "s2-55", "subj": 2, "n": 55, "unit": 5, "a": "O", "s": "정확도와 정밀도는 트레이드오프(Trade-off) 관계가 되는 경우가 많다.", "e": "목적에 따라 무엇을 우선할지 달라져요.", "src": "36·43회 변형"}, {"id": "s2-56", "subj": 2, "n": 56, "unit": 5, "a": "X", "s": "분석 모델의 복잡도를 높이면 정확도는 무조건 상승한다.", "e": "정확도를 높이면 복잡도가 상승'할 수 있다'는 트레이드오프일 뿐, 무조건 상승하지 않아요.", "src": "45회 변형"}, {"id": "s2-57", "subj": 2, "n": 57, "unit": 5, "a": "O", "s": "분석 프로젝트의 시간 관리에는 타임박싱(Time Boxing) 기법을 활용한다.", "e": "타임박싱으로 병목을 관리하고 마일스톤별 일정을 지켜요.", "src": "핵심 개념"}, {"id": "s2-58", "subj": 2, "n": 58, "unit": 5, "a": "X", "s": "데이터 품질관리는 품질 검토와 품질 보증 두 가지 활동으로만 구성된다.", "e": "품질 계획이 빠졌어요. 품질 계획 · 품질 관리 · 품질 보증 3요소로 구성돼요.", "src": "48회 변형"}, {"id": "s2-59", "subj": 2, "n": 59, "unit": 6, "a": "O", "s": "분석 마스터 플랜은 과제 도출 → 과제 우선순위 결정 → 적용 우선순위 결정 → 분석 구현 로드맵 수립 순서로 수립한다.", "e": "마스터 플랜은 장기(Long Term View) 관점의 계획이에요.", "src": "핵심 개념"}, {"id": "s2-60", "subj": 2, "n": 60, "unit": 6, "a": "O", "s": "과제 우선순위를 정할 때는 전략적 중요도, 실행 용이성, 비즈니스 성과(ROI)를 고려한다.", "e": "우선순위 고려 요소 3가지예요.", "src": "33·47회 변형"}, {"id": "s2-61", "subj": 2, "n": 61, "unit": 6, "a": "X", "s": "기술 적용 수준은 분석 과제의 우선순위를 정할 때 고려하는 요소이다.", "e": "기술 적용 수준은 적용 범위/방식 고려 요소예요(업무 내재화 · 분석 데이터 · 기술 적용 수준).", "src": "37·48회 변형"}, {"id": "s2-62", "subj": 2, "n": 62, "unit": 6, "a": "X", "s": "실행 용이성은 분석 마스터 플랜의 적용 범위 및 방식을 정할 때 고려하는 요소이다.", "e": "실행 용이성은 우선순위 고려 요소예요. 두 묶음을 섞은 선지에 주의하세요.", "src": "38회 변형"}, {"id": "s2-63", "subj": 2, "n": 63, "unit": 6, "a": "O", "s": "전략적 주요 정보를 바탕으로 전사적 종합추진 계획과 중장기 마스터 플랜을 수립하는 방법은 ISP이다.", "e": "ISP = Information Strategy Planning(정보 전략 계획)이에요.", "src": "37·49회 변형"}, {"id": "s2-64", "subj": 2, "n": 64, "unit": 6, "a": "O", "s": "분석 과제의 시급성을 판단하는 핵심 기준은 전략적 중요도이다.", "e": "시급성 = 전략적 중요도 · 목표 가치 → Value(Return)예요.", "src": "35·42회 변형"}, {"id": "s2-65", "subj": 2, "n": 65, "unit": 6, "a": "X", "s": "분석 과제의 시급성은 데이터의 양과 범위, 분석 비용으로 결정된다.", "e": "양 · 범위 · 비용은 난이도(Investment) 쪽 기준이에요.", "src": "46·48회 변형"}, {"id": "s2-66", "subj": 2, "n": 66, "unit": 6, "a": "X", "s": "ROI 관점에서 Value(가치)는 투자비용(Investment) 요소에 해당한다.", "e": "Value는 비즈니스 효과(Return)예요. 투자비용은 Volume · Variety · Velocity예요.", "src": "32·35회 변형"}, {"id": "s2-67", "subj": 2, "n": 67, "unit": 6, "a": "O", "s": "시급성이 높고(현재) 난이도가 낮은(쉬움) 과제를 가장 먼저 추진한다.", "e": "사분면의 3영역, Quick-Win 과제예요.", "src": "35·43·44회 변형"}, {"id": "s2-68", "subj": 2, "n": 68, "unit": 6, "a": "X", "s": "시급성을 우선순위 기준으로 두면 III → I → II 순서로 추진한다.", "e": "시급성 우선은 III → IV → II, 난이도 우선이 III → I → II예요.", "src": "33회 변형"}, {"id": "s2-69", "subj": 2, "n": 69, "unit": 6, "a": "X", "s": "시급성이 높고 난이도가 어려운 과제는 기업의 여건과 상관없이 반드시 가장 먼저 추진해야 한다.", "e": "이 과제(1영역)는 경영진 의사결정에 따라 우선순위를 조정할 수 있어요.", "src": "33회 변형"}, {"id": "s2-70", "subj": 2, "n": 70, "unit": 6, "a": "X", "s": "분석을 도입할 때는 여러 분석 과제를 동시에 진행하는 것이 바람직하다.", "e": "과제를 도출하고 우선순위를 정해 핵심 과제에 집중해요.", "src": "46회 변형"}, {"id": "s2-71", "subj": 2, "n": 71, "unit": 7, "a": "O", "s": "분석 거버넌스 체계는 조직, 프로세스, 데이터, 시스템, 교육(분석 교육·마인드 육성 체계)으로 구성된다.", "e": "분석 거버넌스 5요소예요.", "src": "41회 변형"}, {"id": "s2-72", "subj": 2, "n": 72, "unit": 7, "a": "X", "s": "분석 기법(Technology)은 분석 거버넌스 체계의 구성요소이다.", "e": "분석 기법은 구성요소가 아니에요. '과제 예방과 비용 집행'도 아니에요(41회).", "src": "44회 변형"}, {"id": "s2-73", "subj": 2, "n": 73, "unit": 7, "a": "O", "s": "별도의 독립적인 분석 전담 조직이 전사 분석 업무를 맡고, 전략적 중요도에 따라 우선순위를 정해 추진하는 구조는 집중형 조직이다.", "e": "집중형 = 독립 조직 · 일괄 담당 · 전사 우선순위예요.", "src": "35·40·49회 변형"}, {"id": "s2-74", "subj": 2, "n": 74, "unit": 7, "a": "O", "s": "집중형 조직은 현업 부서의 분석 업무와 중복(이원화)될 가능성이 있다.", "e": "집중형의 대표 단점이에요.", "src": "35·40·49회 변형"}, {"id": "s2-75", "subj": 2, "n": 75, "unit": 7, "a": "X", "s": "분산 조직 구조는 분석 결과를 실무에 적용하는 대응이 느리다.", "e": "분산 조직은 분석 인력이 현업에 배치되어 실무 적용이 신속해요.", "src": "35·38·48회 변형"}, {"id": "s2-76", "subj": 2, "n": 76, "unit": 7, "a": "X", "s": "기능 중심 조직 구조는 전사적 관점에서 핵심 분석을 수행하기 쉽다.", "e": "부서마다 따로 분석하므로 전사적 관점의 분석 관리가 어려워요.", "src": "38회 변형"}, {"id": "s2-77", "subj": 2, "n": 77, "unit": 7, "a": "X", "s": "협업형 조직은 데이터 분석 조직 구조 3유형 중 하나이다.", "e": "3유형은 집중형 · 기능 중심 · 분산 조직이에요. 협업형 · 매트릭스는 함정이에요.", "src": "39·47회 변형"}, {"id": "s2-78", "subj": 2, "n": 78, "unit": 7, "a": "O", "s": "분석 과제 발굴은 분석 아이디어 발굴 → 과제 후보 제안 → 분석 과제 확정 순서로 진행한다.", "e": "확정은 '발굴'의 마지막 단계예요.", "src": "핵심 개념"}, {"id": "s2-79", "subj": 2, "n": 79, "unit": 7, "a": "X", "s": "팀 구성은 분석 과제 관리 프로세스 중 과제 발굴 단계에 속한다.", "e": "팀 구성은 과제 수행의 첫 단계예요(팀 구성 → 실행 → 진행 관리 → 결과 공유).", "src": "39회 변형"}, {"id": "s2-80", "subj": 2, "n": 80, "unit": 7, "a": "O", "s": "분석 체계 정착은 도입 → 유효성 검증 → 확산 및 고도화 순서로 진행한다.", "e": "검증 없이 확산하는 순서는 틀려요.", "src": "41·50회 변형"}, {"id": "s2-81", "subj": 2, "n": 81, "unit": 7, "a": "X", "s": "운영체제(OS)는 협의의 분석 플랫폼 구성요소이다.", "e": "OS · 하드웨어는 광의에만 들어가요. 협의는 데이터 처리 프레임워크 · 분석 엔진 · 분석 라이브러리예요.", "src": "42·49회 변형"}, {"id": "s2-82", "subj": 2, "n": 82, "unit": 8, "a": "O", "s": "데이터 거버넌스는 전사 차원의 모든 데이터에 대해 정책·지침, 표준화, 운영조직 및 책임 등의 표준화된 관리체계를 수립하는 것이다.", "e": "프로세스 · 운영조직을 포함하는 전사 차원의 데이터 관리 체계예요.", "src": "34·45회 변형"}, {"id": "s2-83", "subj": 2, "n": 83, "unit": 8, "a": "X", "s": "데이터 거버넌스는 전담 조직에서 독립적으로 운영되어야 한다.", "e": "IT · 법무 · 현업 부서가 함께 참여하는 전사적 체계예요.", "src": "47회 변형"}, {"id": "s2-84", "subj": 2, "n": 84, "unit": 8, "a": "X", "s": "데이터 거버넌스의 구성 요소는 원칙, 조직, 분석 방법이다.", "e": "구성 요소는 원칙 · 조직 · 프로세스예요.", "src": "35·39회 변형"}, {"id": "s2-85", "subj": 2, "n": 85, "unit": 8, "a": "O", "s": "데이터 거버넌스의 관리 대상은 마스터 데이터, 메타데이터, 데이터 사전이다.", "e": "구성 요소(원칙 · 조직 · 프로세스)와 섞어 낸 선지에 주의하세요.", "src": "34회 변형"}, {"id": "s2-86", "subj": 2, "n": 86, "unit": 8, "a": "O", "s": "표준용어 설정, 명명 규칙 수립, 메타데이터 구축, 데이터 사전 구축은 데이터 표준화에 해당한다.", "e": "데이터 거버넌스 체계 요소 중 첫 번째인 데이터 표준화예요.", "src": "37·43회 변형"}, {"id": "s2-87", "subj": 2, "n": 87, "unit": 8, "a": "X", "s": "데이터 거버넌스 체계를 구축한 뒤에는 표준 준수 여부를 따로 점검할 필요가 없다.", "e": "구축 후에도 표준 준수 여부를 주기적으로 점검해야 해요(표준화 활동).", "src": "48회 변형"}, {"id": "s2-88", "subj": 2, "n": 88, "unit": 8, "a": "X", "s": "데이터 운용 비용은 데이터 거버넌스 체계 요소이다.", "e": "체계 요소는 데이터 표준화 · 데이터 관리체계 · 데이터 저장소 관리 · 표준화 활동이에요.", "src": "48회 변형"}, {"id": "s2-89", "subj": 2, "n": 89, "unit": 8, "a": "O", "s": "빅데이터 거버넌스는 기존 데이터 거버넌스 체계에 데이터 최적화, 정보 보호, 데이터 카테고리별 관리 책임자 지정 등을 더한 것이다.", "e": "새로 만드는 게 아니라 기존 체계 + α예요.", "src": "핵심 개념"}, {"id": "s2-90", "subj": 2, "n": 90, "unit": 9, "a": "O", "s": "데이터 분석 수준 진단의 목적은 현재 분석 수준을 객관적으로 파악하고, 분석 역량을 높이기 위한 목표와 방향을 정하는 것이다.", "e": "진단은 끝이 아니라 출발점이에요.", "src": "50회 변형"}, {"id": "s2-91", "subj": 2, "n": 91, "unit": 9, "a": "X", "s": "데이터 분석 수준 진단의 주요 목표는 유사 업종·경쟁사와 비교하는 것이다.", "e": "경쟁사 비교는 목표 수준 설정의 참고 자료일 뿐 주목표가 아니에요. 홍보 · 인사고과도 목적이 아니에요.", "src": "38·48회 변형"}, {"id": "s2-92", "subj": 2, "n": 92, "unit": 9, "a": "O", "s": "분석 준비도는 분석 업무 파악, 인력 및 조직, 분석 기법, 분석 데이터, 분석 문화, IT 인프라의 6개 영역으로 진단한다.", "e": "돈(비용 · 재무)과 성과에 관한 영역은 없어요.", "src": "핵심 개념"}, {"id": "s2-93", "subj": 2, "n": 93, "unit": 9, "a": "X", "s": "비용 및 예산은 분석 준비도 진단 영역에 포함된다.", "e": "준비도 6개 영역에 비용 · 예산, 재무 상태는 없어요.", "src": "42·46·47회 변형"}, {"id": "s2-94", "subj": 2, "n": 94, "unit": 9, "a": "X", "s": "분석 성과(비즈니스 성과)는 분석 준비도 진단 영역에 포함된다.", "e": "분석 성과는 진단의 결과일 뿐 준비도 조사 대상이 아니에요.", "src": "32·36·48회 변형"}, {"id": "s2-95", "subj": 2, "n": 95, "unit": 9, "a": "O", "s": "운영 시스템 데이터 통합, EAI·ETL, 빅데이터 분석 환경 등은 분석 준비도 중 IT 인프라(분석 인프라) 영역이다.", "e": "IT 인프라 = 운영 시스템 데이터 통합 · 분석 환경이에요.", "src": "38회 변형"}, {"id": "s2-96", "subj": 2, "n": 96, "unit": 9, "a": "O", "s": "분석 성숙도는 CMMI 모델을 기반으로 비즈니스 부문, 조직 및 역량 부문, IT 부문을 진단한다.", "e": "성숙도 진단에 비용은 고려하지 않아요.", "src": "핵심 개념"}, {"id": "s2-97", "subj": 2, "n": 97, "unit": 9, "a": "X", "s": "서비스 부문은 분석 성숙도 진단 부문에 포함된다.", "e": "진단 부문은 비즈니스 · 조직 및 역량 · IT예요. 서비스 · 비용 · 기업 문화는 아니에요.", "src": "36·37·50회 변형"}, {"id": "s2-98", "subj": 2, "n": 98, "unit": 9, "a": "X", "s": "분석 성숙도는 도입 → 확산 → 활용 → 최적화 단계로 발전한다.", "e": "순서는 도입 → 활용 → 확산 → 최적화예요.", "src": "32회 변형"}, {"id": "s2-99", "subj": 2, "n": 99, "unit": 9, "a": "O", "s": "분석 결과를 활용해 혁신과 성과 향상에 기여하는 성숙도 단계는 최적화 단계이다.", "e": "최적화 예시 : 분석 Sandbox, 프로세스 내재화, 빅데이터 분석이에요.", "src": "42회 변형"}, {"id": "s2-100", "subj": 2, "n": 100, "unit": 9, "a": "X", "s": "분석 준비도는 높지만 분석 업무·기법 등이 부족한 기업은 정착형에 해당한다.", "e": "준비도↑ · 성숙도↓는 도입형이에요. 정착형은 준비도↓ · 성숙도↑예요.", "src": "41·45회 변형"}, {"id": "s3-1", "subj": 3, "n": 1, "unit": 1, "a": "O", "s": "결측값을 대치하는 목적은 표본 수를 유지해 정보 손실을 최소화하는 것이다.", "e": "행을 지우면 데이터가 줄어 효율성이 떨어지니, 채워서 표본 수를 지켜요.", "src": "46회 변형"}, {"id": "s3-2", "subj": 3, "n": 2, "unit": 1, "a": "X", "s": "결측치는 모두 0으로 바꾼 뒤 평균을 계산하는 것이 일반적인 처리 방법이다.", "e": "NA(모름)와 0은 뜻이 달라요. 0으로 바꾸면 평균이 엉뚱하게 낮아져요.", "src": "45회 변형"}, {"id": "s3-3", "subj": 3, "n": 3, "unit": 1, "a": "O", "s": "두 변수가 서로 독립적으로 각각 10%씩 결측일 때, 결측이 하나라도 있는 행을 모두 삭제하면 전체의 19%가 삭제된다.", "e": "둘 다 채워진 행 = 0.9 × 0.9 = 0.81 → 삭제 비율 = 1 − 0.81 = 0.19예요.", "src": "48회 변형"}, {"id": "s3-4", "subj": 3, "n": 4, "unit": 1, "a": "X", "s": "완전 분석법은 결측값을 해당 변수의 평균으로 대치하는 방법이다.", "e": "완전 분석법은 결측이 있는 행을 통째로 삭제하는 방법이에요. 평균으로 채우는 건 평균 대치법이에요.", "src": "49회 변형"}, {"id": "s3-5", "subj": 3, "n": 5, "unit": 1, "a": "O", "s": "평균 대치법은 같은 값이 여러 번 들어가므로 통계량의 표준오차가 과소추정될 수 있다.", "e": "이 단점을 보완하려고 단순 확률 대치법(Hot-Deck 등)을 써요.", "src": "핵심 개념"}, {"id": "s3-6", "subj": 3, "n": 6, "unit": 1, "a": "X", "s": "Cold-Deck은 현재 데이터 안에서 성향이 가장 비슷한 응답자의 값으로 결측을 채우는 방법이다.", "e": "현재 데이터 안에서 가져오면 Hot-Deck이에요. Cold-Deck은 이전 연구·외부 DB 등 외부 출처의 값을 써요.", "src": "핵심 개념"}, {"id": "s3-7", "subj": 3, "n": 7, "unit": 1, "a": "O", "s": "다중 대치법은 단순 대치를 여러 번 반복하며 대치 → 분석 → 결합의 3단계로 진행한다.", "e": "단순 대치를 m번 해서 결과를 결합해요.", "src": "핵심 개념"}, {"id": "s3-8", "subj": 3, "n": 8, "unit": 1, "a": "X", "s": "이상값은 분석 결과를 왜곡하므로 발견되면 반드시 모두 제거해야 한다.", "e": "카드 사기 거래처럼 튀는 값 자체가 중요한 신호일 수 있어요. 분석 목적에 따라 삭제·대체·유지를 판단해요.", "src": "49회 변형"}, {"id": "s3-9", "subj": 3, "n": 9, "unit": 1, "a": "O", "s": "ESD는 데이터가 정규분포를 따른다고 볼 때 평균에서 표준편차의 3배를 벗어나는 값을 이상값으로 본다.", "e": "정상 범위는 μ − 3σ ~ μ + 3σ예요.", "src": "50회 변형"}, {"id": "s3-10", "subj": 3, "n": 10, "unit": 1, "a": "X", "s": "사분위수(IQR) 방법에서는 Q1 − 3×IQR보다 작거나 Q3 + 3×IQR보다 큰 값을 이상값으로 본다.", "e": "기준은 1.5배예요. Q1 − 1.5×IQR ~ Q3 + 1.5×IQR 밖이 이상값이에요.", "src": "핵심 개념"}, {"id": "s3-11", "subj": 3, "n": 11, "unit": 1, "a": "O", "s": "이상값을 평균·중앙값·회귀분석 예측값으로 대체하면 데이터 손실을 줄일 수 있다.", "e": "이상값 처리는 삭제만 있는 게 아니에요. 원인과 분석 목적에 따라 삭제·대체·유지를 골라요.", "src": "48회 변형"}, {"id": "s3-12", "subj": 3, "n": 12, "unit": 2, "a": "X", "s": "동일한 분석 결과를 얻기 위해 재현성을 검증하는 단계는 탐색적 데이터 분석(EDA)의 주요 활동이다.", "e": "재현성 검증은 모델링·연구를 마친 뒤의 작업이에요.", "src": "47회 변형"}, {"id": "s3-13", "subj": 3, "n": 13, "unit": 2, "a": "O", "s": "EDA에서는 변수 개수·데이터 타입, 기초 통계량, 이상치·결측치, 변수 간 관계를 살펴본다.", "e": "모델을 만들기 전에 데이터의 생김새를 여러 각도로 탐험하는 단계예요.", "src": "핵심 개념"}, {"id": "s3-14", "subj": 3, "n": 14, "unit": 2, "a": "O", "s": "제2사분위수(Q2)는 중앙값과 같다.", "e": "Q1 = 25%, Q2 = 50%(중앙값), Q3 = 75% 지점이에요.", "src": "49회 변형"}, {"id": "s3-15", "subj": 3, "n": 15, "unit": 2, "a": "X", "s": "데이터의 중앙 50%가 흩어진 정도를 나타내는 지표는 표준편차이다.", "e": "중앙 50%의 퍼짐은 사분위범위(IQR = Q3 − Q1)예요. 표준편차는 전체의 퍼짐이에요.", "src": "46회 변형"}, {"id": "s3-16", "subj": 3, "n": 16, "unit": 2, "a": "O", "s": "사분위수는 순서(위치)로 정하므로 평균·표준편차보다 이상치의 영향을 덜 받는다.", "e": "그래서 사분위수를 강건한 통계량이라고 해요.", "src": "핵심 개념"}, {"id": "s3-17", "subj": 3, "n": 17, "unit": 2, "a": "X", "s": "상자그림에서 상자 안의 수평선은 평균을 나타낸다.", "e": "상자 안의 선은 중앙값(Q2)이에요. 기본 상자그림에는 평균이 표시되지 않아요.", "src": "44·48회 변형"}, {"id": "s3-18", "subj": 3, "n": 18, "unit": 2, "a": "X", "s": "상자그림을 보면 각 그룹의 관측치 개수를 알 수 있다.", "e": "기본 상자그림에서는 상자의 폭·길이로 관측치 개수를 알 수 없어요.", "src": "48회 변형"}, {"id": "s3-19", "subj": 3, "n": 19, "unit": 2, "a": "O", "s": "상자그림에서 수염의 끝은 이상치를 제외한 최솟값과 최댓값이다.", "e": "경계(Q1 − 1.5×IQR, Q3 + 1.5×IQR)를 벗어난 값은 점(○)으로 따로 찍혀요.", "src": "47회 변형"}, {"id": "s3-20", "subj": 3, "n": 20, "unit": 2, "a": "X", "s": "이상치는 Q1 + 1.5×IQR보다 작거나 Q3 − 1.5×IQR보다 큰 값이다.", "e": "부호와 기준점이 거꾸로예요. Q1 − 1.5×IQR보다 작거나 Q3 + 1.5×IQR보다 크면 이상치예요.", "src": "49회 변형"}, {"id": "s3-21", "subj": 3, "n": 21, "unit": 2, "a": "O", "s": "Q1 = 20, Q3 = 30이면 사분위수 기준으로 45보다 큰 값은 이상치이다.", "e": "IQR = 10, 1.5×IQR = 15 → 상한 = 30 + 15 = 45예요.", "src": "핵심 개념"}, {"id": "s3-22", "subj": 3, "n": 22, "unit": 2, "a": "X", "s": "상자그림에서 중앙값이 상자 아래쪽에 붙어 있고 위쪽 수염이 길면 왼쪽으로 꼬리가 긴 분포이다.", "e": "위쪽(큰 값 쪽) 꼬리가 길므로 오른쪽으로 꼬리가 긴 분포예요.", "src": "핵심 개념"}, {"id": "s3-23", "subj": 3, "n": 23, "unit": 3, "a": "X", "s": "온도·IQ처럼 간격은 같지만 절대영점이 없는 척도는 비율척도이다.", "e": "절대영점이 없고 덧셈·뺄셈만 가능하면 구간(등간)척도예요.", "src": "48회 변형"}, {"id": "s3-24", "subj": 3, "n": 24, "unit": 3, "a": "O", "s": "무게·나이처럼 절대영점이 있어 사칙연산이 모두 가능한 척도는 비율척도이다.", "e": "0kg은 진짜 '무게 없음'이라 60kg은 30kg의 2배예요.", "src": "47회 변형"}, {"id": "s3-25", "subj": 3, "n": 25, "unit": 3, "a": "X", "s": "수도권/비수도권 구분은 서열척도에 해당한다.", "e": "순서 없이 분류만 하므로 명목척도예요.", "src": "45회 변형"}, {"id": "s3-26", "subj": 3, "n": 26, "unit": 3, "a": "O", "s": "y = 2x + 3처럼 양수를 곱하는 선형변환을 해도 분포의 왜도는 변하지 않는다.", "e": "왜도는 분포의 모양 지표라 위치 이동·양수배 확대에 영향을 받지 않아요.", "src": "49회 변형"}, {"id": "s3-27", "subj": 3, "n": 27, "unit": 3, "a": "X", "s": "요약변수는 특정 조건이나 함수를 이용해 값을 만들고 사용자가 의미를 부여한 변수이다.", "e": "이건 파생변수 설명이에요. 요약변수는 수집 정보를 종합·집계한 변수(총 구매 금액 등)예요.", "src": "44회 변형"}, {"id": "s3-28", "subj": 3, "n": 28, "unit": 3, "a": "O", "s": "파생변수는 사용자가 주관적으로 의미를 부여한 변수이므로 논리적 타당성을 갖춰야 한다.", "e": "요약변수 = 집계(재활용성↑), 파생변수 = 의미 부여(타당성 필요)예요.", "src": "핵심 개념"}, {"id": "s3-29", "subj": 3, "n": 29, "unit": 3, "a": "X", "s": "로그 변환은 왼쪽으로 꼬리가 긴(음의 왜도) 분포를 정규분포에 가깝게 만드는 데 쓴다.", "e": "로그 변환은 오른쪽 꼬리(양의 왜도)를 완화해요. 왼쪽 꼬리는 지수 변환이에요.", "src": "핵심 개념"}, {"id": "s3-30", "subj": 3, "n": 30, "unit": 3, "a": "X", "s": "원-핫 인코딩은 범주의 개수가 많아져도 생성되는 컬럼 수가 늘지 않는다.", "e": "고유값 수만큼 컬럼이 생겨서, 범주가 많으면 차원의 저주가 생겨요.", "src": "핵심 개념"}, {"id": "s3-31", "subj": 3, "n": 31, "unit": 3, "a": "O", "s": "평균은 극단값에 크게 끌려가지만, 중앙값은 극단값의 영향을 적게 받는다.", "e": "용돈 1, 2, 2, 3, 12의 평균은 4, 중앙값은 2예요.", "src": "핵심 개념"}, {"id": "s3-32", "subj": 3, "n": 32, "unit": 3, "a": "X", "s": "X의 평균이 10, 분산이 4일 때 Z = 2X + 3의 분산은 11이다.", "e": "분산은 a²σ² = 2² × 4 = 16이에요. 더하는 3은 퍼짐에 영향이 없어요(평균은 23).", "src": "핵심 개념"}, {"id": "s3-33", "subj": 3, "n": 33, "unit": 3, "a": "O", "s": "변동계수(CV)는 표준편차를 평균으로 나눈 값으로, 단위나 평균이 다른 자료의 퍼짐을 비교할 때 쓴다.", "e": "CV = 표준편차 / 평균 × 100%예요.", "src": "핵심 개념"}, {"id": "s3-34", "subj": 3, "n": 34, "unit": 3, "a": "X", "s": "오른쪽으로 꼬리가 긴(왜도 > 0) 분포에서는 최빈값 > 중앙값 > 평균 순서가 된다.", "e": "평균은 꼬리 쪽으로 끌려가요. 왜도 > 0이면 일반적으로 평균 > 중앙값 > 최빈값이에요.", "src": "47회 변형"}, {"id": "s3-35", "subj": 3, "n": 35, "unit": 4, "a": "O", "s": "시행을 매우 많이 반복했을 때 사건이 일어난 상대도수(r/n)로 정한 확률을 통계적 확률이라고 한다.", "e": "모든 결과가 같은 가능성이라 가정하고 이론으로 계산하면 수학적 확률이에요.", "src": "44회 변형"}, {"id": "s3-36", "subj": 3, "n": 36, "unit": 4, "a": "X", "s": "두 사건이 서로 독립이면 두 사건이 동시에 일어날 확률은 두 사건 확률의 합이다.", "e": "독립이면 곱이에요. P(A∩B) = P(A)·P(B)예요.", "src": "44·50회 변형"}, {"id": "s3-37", "subj": 3, "n": 37, "unit": 4, "a": "O", "s": "배반사건은 동시에 일어날 수 없으므로 P(A∩B) = 0이다.", "e": "배반이면 P(A∪B) = P(A) + P(B)로 단순히 더해요.", "src": "핵심 개념"}, {"id": "s3-38", "subj": 3, "n": 38, "unit": 4, "a": "O", "s": "확률이 0보다 큰 두 사건이 배반사건이면, 두 사건은 서로 독립이 아니다.", "e": "한쪽이 일어나면 다른 쪽은 반드시 안 일어나니 서로 영향을 줘요.", "src": "49회 변형"}, {"id": "s3-39", "subj": 3, "n": 39, "unit": 4, "a": "O", "s": "조건부 확률 P(A|B)는 P(A∩B)를 P(B)로 나누어 구한다(단, P(B) > 0).", "e": "전체가 아니라 B 안에서의 비율을 보는 거예요.", "src": "핵심 개념"}, {"id": "s3-40", "subj": 3, "n": 40, "unit": 4, "a": "X", "s": "조건부 확률 P(A|B)와 P(B|A)는 항상 같은 값이다.", "e": "분모가 달라서 보통 달라요. 예 : P(사과|남) = 30/70, P(남|사과) = 30/40", "src": "44회 변형"}, {"id": "s3-41", "subj": 3, "n": 41, "unit": 4, "a": "X", "s": "연속형 확률변수의 확률밀도함수(PDF) 값은 항상 0과 1 사이이다.", "e": "PDF 값은 밀도라서 1보다 클 수 있어요. 0~1 사이인 것은 PMF 값이에요.", "src": "49회 변형"}, {"id": "s3-42", "subj": 3, "n": 42, "unit": 4, "a": "O", "s": "이산형 확률변수의 확률질량함수(PMF) 값을 모두 더하면 1이다.", "e": "PMF 값은 그 자체가 확률이라 0~1 사이이고, 합은 1이에요.", "src": "핵심 개념"}, {"id": "s3-43", "subj": 3, "n": 43, "unit": 4, "a": "X", "s": "지수분포는 이산형 확률분포이다.", "e": "다음 사건까지 걸리는 시간을 재는 연속형 분포예요. 이항·초기하·기하는 이산형이에요.", "src": "49회 변형"}, {"id": "s3-44", "subj": 3, "n": 44, "unit": 4, "a": "O", "s": "비복원 추출에서 성공 횟수는 초기하분포를, 복원 추출에서는 이항분포를 따른다.", "e": "비복원은 뽑을 때마다 구성이 바뀌어 각 시행이 독립이 아니에요.", "src": "핵심 개념"}, {"id": "s3-45", "subj": 3, "n": 45, "unit": 4, "a": "X", "s": "포아송분포의 기댓값은 λ이고 분산은 λ²이다.", "e": "포아송분포는 기댓값과 분산이 모두 λ예요.", "src": "핵심 개념"}, {"id": "s3-46", "subj": 3, "n": 46, "unit": 4, "a": "O", "s": "P(X=1) = 0.4, P(X=2) = 0.3, P(X=3) = 0.2, P(X=4) = 0.1이면 기댓값 E(X)는 2.0이다.", "e": "1×0.4 + 2×0.3 + 3×0.2 + 4×0.1 = 2.0이에요.", "src": "46회 변형"}, {"id": "s3-47", "subj": 3, "n": 47, "unit": 5, "a": "O", "s": "일부 특성만 극단적으로 반영된 표본 편의(Sampling Bias)는 확률화(Randomization)로 최소화할 수 있다.", "e": "그래서 누가 뽑힐지 확률에 맡기는 확률적 표본추출법이 중요해요.", "src": "핵심 개념"}, {"id": "s3-48", "subj": 3, "n": 48, "unit": 5, "a": "O", "s": "단순무작위 추출은 모집단의 모든 개체가 표본으로 뽑힐 확률이 같다.", "e": "번호 공 추첨처럼 무작위로 뽑아요.", "src": "핵심 개념"}, {"id": "s3-49", "subj": 3, "n": 49, "unit": 5, "a": "X", "s": "계통 추출은 일련번호를 붙인 뒤 각 구간마다 무작위로 표본을 뽑는 방법이다.", "e": "무작위는 시작점만이고, 그 뒤로는 일정한 간격으로 뽑아요.", "src": "47회 변형"}, {"id": "s3-50", "subj": 3, "n": 50, "unit": 5, "a": "O", "s": "층화 추출은 층 내부는 동질적이고 층 간은 이질적이 되도록 나눈 뒤 모든 층에서 표본을 뽑는다.", "e": "층화 = 층 내 동질 · 층 간 이질, 모든 층에서 추출이에요.", "src": "핵심 개념"}, {"id": "s3-51", "subj": 3, "n": 51, "unit": 5, "a": "X", "s": "집락(군집) 추출에서는 각 집락의 내부가 동질적이어야 한다.", "e": "집락은 내부가 이질적이고 집락끼리 동질적이에요. 층화와 정반대예요.", "src": "49회 변형"}, {"id": "s3-52", "subj": 3, "n": 52, "unit": 5, "a": "O", "s": "집락 추출은 집단을 먼저 뽑고 그 안에서 다시 표본을 뽑는 다단계 방법이다.", "e": "예 : 같은 학년 여러 반 중 몇 반을 고른 뒤, 그 반 안에서 다시 학생을 뽑는 방식이에요.", "src": "47회 변형"}, {"id": "s3-53", "subj": 3, "n": 53, "unit": 5, "a": "X", "s": "부트스트랩은 비복원 추출로 표본을 구성하므로 같은 데이터가 두 번 뽑히지 않는다.", "e": "부트스트랩은 복원 추출이라 같은 데이터가 여러 번 뽑힐 수 있어요.", "src": "핵심 개념"}, {"id": "s3-54", "subj": 3, "n": 54, "unit": 5, "a": "X", "s": "비표본오차는 표본 크기를 늘리면 줄어든다.", "e": "표본 크기를 늘려 줄어드는 건 표본오차뿐이에요. 비표본오차는 조사 과정의 실수라 줄지 않아요.", "src": "49회 변형"}, {"id": "s3-55", "subj": 3, "n": 55, "unit": 5, "a": "O", "s": "표본오차는 표본 크기가 커질수록 0에 가까워진다.", "e": "표본의 대표성 부족에서 생기는 오차라 n이 커지면 줄어요.", "src": "핵심 개념"}, {"id": "s3-56", "subj": 3, "n": 56, "unit": 5, "a": "X", "s": "표본추출 방법을 잘 설계하면 비표본오차를 최소화할 수 있다.", "e": "비표본오차는 수집·조사·분석 과정의 실수예요. 표본추출로 줄일 수 있는 건 표본오차예요.", "src": "47회 변형"}, {"id": "s3-57", "subj": 3, "n": 57, "unit": 6, "a": "X", "s": "표본으로 계산한 평균·분산·표준편차는 모수에 해당한다.", "e": "표본으로 계산한 값은 통계량이에요.", "src": "50회 변형"}, {"id": "s3-58", "subj": 3, "n": 58, "unit": 6, "a": "O", "s": "표본평균의 기댓값은 모평균과 같다(E(x̄) = μ).", "e": "그래서 표본평균은 모평균의 불편추정량이에요.", "src": "핵심 개념"}, {"id": "s3-59", "subj": 3, "n": 59, "unit": 6, "a": "X", "s": "모표준편차가 20이고 표본 크기가 100이면 표본평균의 표준오차는 0.2이다.", "e": "SE = σ / √n = 20 / √100 = 2예요. 분모는 n이 아니라 √n이에요.", "src": "44회 변형"}, {"id": "s3-60", "subj": 3, "n": 60, "unit": 6, "a": "O", "s": "다른 조건이 같을 때 표본 크기를 4배로 늘리면 표준오차는 절반이 된다.", "e": "√4 = 2이므로 σ / √n이 절반이 돼요.", "src": "핵심 개념"}, {"id": "s3-61", "subj": 3, "n": 61, "unit": 6, "a": "X", "s": "중심극한정리를 적용하려면 모집단이 반드시 정규분포를 따라야 한다.", "e": "모집단이 정규분포가 아니어도 n이 충분히 크면 표본평균의 분포는 정규분포에 근사해요.", "src": "44회 변형"}, {"id": "s3-62", "subj": 3, "n": 62, "unit": 6, "a": "O", "s": "중심극한정리에 따르면 표본 크기가 충분히 크면 표본평균의 분포는 정규분포에 근사한다.", "e": "보통 n ≥ 30이면 충분하다고 봐요.", "src": "핵심 개념"}, {"id": "s3-63", "subj": 3, "n": 63, "unit": 6, "a": "X", "s": "중심극한정리는 표본 크기가 커지면 개별 데이터의 분포가 정규분포가 된다는 정리이다.", "e": "정규분포에 가까워지는 건 개별 데이터가 아니라 표본평균의 분포예요.", "src": "핵심 개념"}, {"id": "s3-64", "subj": 3, "n": 64, "unit": 6, "a": "O", "s": "표본분산을 n이 아니라 n − 1로 나누는 것은 기댓값이 모분산과 같아지게(불편추정량) 하기 위해서이다.", "e": "불편성 = 추정량의 기댓값이 모수와 같은 성질이에요.", "src": "핵심 개념"}, {"id": "s3-65", "subj": 3, "n": 65, "unit": 6, "a": "X", "s": "추정량의 효율성이란 추정량의 기댓값이 모수와 같다는 성질이다.", "e": "그건 불편성이에요. 효율성은 추정량의 분산이 작은 성질이에요.", "src": "핵심 개념"}, {"id": "s3-66", "subj": 3, "n": 66, "unit": 6, "a": "O", "s": "신뢰수준을 높이면 신뢰구간은 넓어지고, 표본 크기를 늘리면 신뢰구간은 좁아진다.", "e": "z값이 커지면 넓어지고(95% 1.96 → 99% 2.575), n이 커지면 SE가 줄어 좁아져요.", "src": "핵심 개념"}, {"id": "s3-67", "subj": 3, "n": 67, "unit": 6, "a": "X", "s": "신뢰수준 95%란 계산된 하나의 신뢰구간 안에 모수가 포함될 확률이 95%라는 뜻이다.", "e": "모수는 고정된 값이에요. 같은 방법으로 구간을 여러 번 만들면 약 95%가 모수를 포함한다는 뜻이에요.", "src": "48회 변형"}, {"id": "s3-68", "subj": 3, "n": 68, "unit": 7, "a": "X", "s": "검정통계량은 하나의 단일 값으로 산출되므로 그 값만으로 가설을 판단한다.", "e": "검정통계량은 기각역(임계값)이나 p-value와 비교해야 결론이 나요.", "src": "48회 변형"}, {"id": "s3-69", "subj": 3, "n": 69, "unit": 7, "a": "O", "s": "귀무가설은 보통 '차이·효과가 없다'는 가설이고, 대립가설은 연구자가 입증하려는 가설이다.", "e": "H₀를 기각하면 H₁을 채택해요.", "src": "49회 변형"}, {"id": "s3-70", "subj": 3, "n": 70, "unit": 7, "a": "O", "s": "p-value가 유의수준 α보다 작으면 귀무가설을 기각하고 대립가설을 채택한다.", "e": "p-value < α → H₀ 기각, p-value ≥ α → H₀ 기각 못 함이에요.", "src": "46회 변형"}, {"id": "s3-71", "subj": 3, "n": 71, "unit": 7, "a": "X", "s": "p-value가 유의수준보다 크면 귀무가설을 기각한다.", "e": "거꾸로예요. p-value가 α보다 크면 귀무가설을 기각하지 못해요.", "src": "49회 변형"}, {"id": "s3-72", "subj": 3, "n": 72, "unit": 7, "a": "X", "s": "p-value가 클수록 귀무가설을 기각할 가능성이 높아진다.", "e": "p-value가 작을수록 대립가설을 지지하는 증거가 강해 귀무가설을 기각해요.", "src": "47회 변형"}, {"id": "s3-73", "subj": 3, "n": 73, "unit": 7, "a": "X", "s": "p-value는 귀무가설이 맞을 확률이다.", "e": "p-value는 귀무가설이 참이라는 가정 아래, 지금만큼(또는 더) 극단적인 결과가 나올 확률이에요.", "src": "핵심 개념"}, {"id": "s3-74", "subj": 3, "n": 74, "unit": 7, "a": "X", "s": "유의수준 α는 제1종 오류를 범할 확률의 최소 허용 한계이다.", "e": "α는 제1종 오류의 최대(상한) 허용 한계예요.", "src": "47회 변형"}, {"id": "s3-75", "subj": 3, "n": 75, "unit": 7, "a": "O", "s": "검정통계량의 분포가 대칭일 때, 양측검정의 p-value는 관측된 방향의 단측검정 p-value의 2배이다.", "e": "반대쪽의 똑같이 극단적인 경우까지 더하기 때문이에요.", "src": "50회 변형"}, {"id": "s3-76", "subj": 3, "n": 76, "unit": 7, "a": "O", "s": "동전을 5번 던져 모두 앞면이 나왔을 때, H₀ : p = 0.5에 대한 양측검정 p-value는 1/16이다.", "e": "단측 (1/2)⁵ = 1/32, 양측은 × 2 = 1/16 = 0.0625예요. α = 0.05면 기각하지 못해요.", "src": "50회 변형"}, {"id": "s3-77", "subj": 3, "n": 77, "unit": 7, "a": "X", "s": "제2종 오류는 귀무가설이 참인데 귀무가설을 기각하는 오류이다.", "e": "이건 제1종 오류(α)예요. 제2종 오류(β)는 귀무가설이 거짓인데 채택하는 오류예요.", "src": "48회 변형"}, {"id": "s3-78", "subj": 3, "n": 78, "unit": 7, "a": "O", "s": "검정력은 대립가설이 참일 때 귀무가설을 올바르게 기각할 확률로, 1 − β이다.", "e": "진짜 범인을 제대로 잡는 능력이에요.", "src": "48회 변형"}, {"id": "s3-79", "subj": 3, "n": 79, "unit": 7, "a": "O", "s": "표본 크기가 같을 때 유의수준 α를 너무 작게 잡으면 제2종 오류(β)의 확률이 커진다.", "e": "α와 β는 시소처럼 움직여요.", "src": "47회 변형"}, {"id": "s3-80", "subj": 3, "n": 80, "unit": 8, "a": "O", "s": "연속형 변수의 평균을 비교할 때 집단이 2개면 t-검정, 3개 이상이면 분산분석(ANOVA)을 사용한다.", "e": "범주형 빈도 비교는 카이제곱 검정이에요.", "src": "핵심 개념"}, {"id": "s3-81", "subj": 3, "n": 81, "unit": 8, "a": "X", "s": "두 변수가 모두 연속형이어도 교차분석(카이제곱 검정)을 그대로 적용할 수 있다.", "e": "교차분석은 범주형 변수의 빈도를 분석하는 방법이에요.", "src": "48회 변형"}, {"id": "s3-82", "subj": 3, "n": 82, "unit": 8, "a": "O", "s": "같은 사람에게 약 복용 전과 후를 측정해 비교할 때는 대응표본 t-검정을 쓴다.", "e": "서로 다른 두 집단 비교는 독립표본 t-검정이에요.", "src": "핵심 개념"}, {"id": "s3-83", "subj": 3, "n": 83, "unit": 8, "a": "X", "s": "자유도가 99인 일표본 t-검정의 데이터 수는 99개이다.", "e": "일표본은 df = n − 1이라 n = 100개예요. 독립표본은 n = df + 2예요.", "src": "46회 변형"}, {"id": "s3-84", "subj": 3, "n": 84, "unit": 8, "a": "X", "s": "Welch t-검정의 자유도가 98.3처럼 소수로 나오면 결과를 신뢰할 수 없다.", "e": "Welch t-검정은 자유도가 소수로 나오는 게 정상이에요.", "src": "47회 변형"}, {"id": "s3-85", "subj": 3, "n": 85, "unit": 8, "a": "X", "s": "분산분석에서 F 통계량이 작을수록 집단 간 평균 차이가 크다.", "e": "F = 집단 간 분산 ÷ 집단 내 분산이라 F가 클수록 차이가 커요.", "src": "49회 변형"}, {"id": "s3-86", "subj": 3, "n": 86, "unit": 8, "a": "O", "s": "분산분석에서 귀무가설이 기각되면 '적어도 한 집단의 평균이 다르다'는 것까지만 알 수 있다.", "e": "어느 집단이 다른지는 사후검정으로 확인해요.", "src": "핵심 개념"}, {"id": "s3-87", "subj": 3, "n": 87, "unit": 8, "a": "O", "s": "두 집단만 비교하는 분산분석에서 F 통계량은 등분산 t-검정 통계량의 제곱과 같다.", "e": "F = t²이라 t-검정과 같은 결론이 나와요.", "src": "49회 변형"}, {"id": "s3-88", "subj": 3, "n": 88, "unit": 8, "a": "X", "s": "카이제곱 적합도 검정은 집단 간 분산의 차이를 검정하는 방법이다.", "e": "적합도 검정은 관측빈도와 기대빈도(도수)의 차이를 봐요.", "src": "45회 변형"}, {"id": "s3-89", "subj": 3, "n": 89, "unit": 8, "a": "O", "s": "2×2 교차표로 독립성 검정을 할 때 자유도는 1이다.", "e": "자유도 = (r − 1) × (c − 1) = 1 × 1 = 1이에요.", "src": "핵심 개념"}, {"id": "s3-90", "subj": 3, "n": 90, "unit": 8, "a": "X", "s": "t-검정은 대표적인 비모수 검정이다.", "e": "t-검정은 정규분포를 가정하는 모수 검정이에요. 순위·부호·런이 들어가면 비모수예요.", "src": "44회 변형"}, {"id": "s3-91", "subj": 3, "n": 91, "unit": 9, "a": "X", "s": "공분산은 측정 단위에 영향을 받지 않으며 항상 −1과 1 사이의 값을 가진다.", "e": "공분산은 단위에 영향을 받고 범위가 정해져 있지 않아요. −1 ~ 1은 상관계수의 성질이에요.", "src": "50회 변형"}, {"id": "s3-92", "subj": 3, "n": 92, "unit": 9, "a": "O", "s": "상관계수는 공분산을 두 변수의 표준편차의 곱으로 나눈 값이다.", "e": "단위를 없애서 항상 −1 ~ 1 사이가 돼요.", "src": "핵심 개념"}, {"id": "s3-93", "subj": 3, "n": 93, "unit": 9, "a": "X", "s": "스피어만 상관계수는 범주형 변수 사이의 선형관계를 측정한다.", "e": "스피어만은 서열·순위 자료의 단조 관계를 측정해요.", "src": "45회 변형"}, {"id": "s3-94", "subj": 3, "n": 94, "unit": 9, "a": "O", "s": "스피어만 상관계수는 순위를 이용하므로 비선형 관계라도 단조 관계라면 측정할 수 있다.", "e": "예 : y = x³ (x = 1~10)이면 피어슨 r ≈ 0.93, 스피어만 ρ = 1이에요.", "src": "47회 변형"}, {"id": "s3-95", "subj": 3, "n": 95, "unit": 9, "a": "X", "s": "성별·혈액형 같은 명목척도 자료에도 스피어만 상관계수를 사용할 수 있다.", "e": "명목척도는 순서가 없어 순위를 매길 수 없으므로 스피어만도 사용할 수 없어요.", "src": "44회 변형"}, {"id": "s3-96", "subj": 3, "n": 96, "unit": 9, "a": "X", "s": "상관계수 r = −1은 두 변수의 관계가 가장 약하다는 뜻이다.", "e": "r = −1은 완벽한 음의 직선 관계, 즉 가장 강한 관계예요. 가장 약한 건 r = 0이에요.", "src": "핵심 개념"}, {"id": "s3-97", "subj": 3, "n": 97, "unit": 9, "a": "O", "s": "r(X, Y) = 0.2일 때 r(−2X + 1, Y − 1)은 −0.2이다.", "e": "더하는 수와 곱한 크기는 무시하고, 곱한 수의 부호만 봐요.", "src": "49회 변형"}, {"id": "s3-98", "subj": 3, "n": 98, "unit": 9, "a": "X", "s": "상관계수가 0이면 두 변수 사이에는 어떤 관계도 없다.", "e": "r = 0은 직선 관계가 없다는 뜻이에요. U자형처럼 곡선 관계는 있을 수 있어요.", "src": "핵심 개념"}, {"id": "s3-99", "subj": 3, "n": 99, "unit": 9, "a": "O", "s": "상관계수가 높다고 해서 두 변수 사이의 인과관계가 보장되는 것은 아니다.", "e": "제3의 변수(교란변수)가 두 변수를 함께 움직였을 수 있어요.", "src": "48회 변형"}, {"id": "s3-100", "subj": 3, "n": 100, "unit": 9, "a": "O", "s": "상관계수의 유의성은 H₀ : ρ = 0에 대한 t-검정(R의 cor.test)으로 확인할 수 있다.", "e": "p-value < α이면 상관관계가 통계적으로 유의해요.", "src": "46회 변형"}, {"id": "s3-101", "subj": 3, "n": 101, "unit": 10, "a": "O", "s": "회귀분석은 독립변수가 종속변수에 미치는 영향을 추정하는 분석으로, 종속변수가 연속형일 때 알맞다.", "e": "명목형 독립변수는 더미변수로 바꿔 넣을 수 있어요.", "src": "핵심 개념"}, {"id": "s3-102", "subj": 3, "n": 102, "unit": 10, "a": "X", "s": "최소제곱법(OLS)은 잔차 절댓값의 합이 가장 작은 직선을 찾는 방법이다.", "e": "OLS는 잔차 제곱합이 가장 작은 직선을 찾아요.", "src": "49회 변형"}, {"id": "s3-103", "subj": 3, "n": 103, "unit": 10, "a": "O", "s": "절편이 있는 회귀모형을 최소제곱법으로 적합하면 잔차의 합은 항상 0이다.", "e": "위로 벗어난 거리와 아래로 벗어난 거리가 상쇄돼요.", "src": "핵심 개념"}, {"id": "s3-104", "subj": 3, "n": 104, "unit": 10, "a": "X", "s": "회귀분석에서 종속변수와 잔차는 서로 상관되지 않아야 한다.", "e": "무상관이어야 하는 건 독립변수와 잔차예요. y = ŷ + e라서 종속변수와 잔차는 양의 상관이에요.", "src": "50회 변형"}, {"id": "s3-105", "subj": 3, "n": 105, "unit": 10, "a": "X", "s": "회귀분석 가정 중 독립성은 독립변수들끼리 서로 관련이 없다는 뜻이다.", "e": "독립성은 독립변수와 오차(잔차) 사이에 상관이 없다는 뜻이에요. 독립변수끼리의 관계는 다중공선성 문제예요.", "src": "45회 변형"}, {"id": "s3-106", "subj": 3, "n": 106, "unit": 10, "a": "O", "s": "잔차의 정규성은 Q-Q plot이나 Shapiro-Wilk 검정으로 확인할 수 있다.", "e": "Kolmogorov-Smirnov, Anderson-Darling 검정도 쓸 수 있어요.", "src": "핵심 개념"}, {"id": "s3-107", "subj": 3, "n": 107, "unit": 10, "a": "X", "s": "더빈-왓슨(Durbin-Watson) 검정은 잔차의 정규성을 확인하는 검정이다.", "e": "더빈-왓슨은 잔차끼리의 자기상관(비상관성)을 보는 검정이에요.", "src": "핵심 개념"}, {"id": "s3-108", "subj": 3, "n": 108, "unit": 10, "a": "X", "s": "잔차도가 U자 곡선 모양이면 릿지·라쏘 같은 규제를 추가해 해결한다.", "e": "U자 잔차도는 비선형 관계라는 신호라 비선형 모델을 적용해요. 릿지·라쏘는 과적합·다중공선성 대책이에요.", "src": "48회 변형"}, {"id": "s3-109", "subj": 3, "n": 109, "unit": 10, "a": "O", "s": "잔차도에서 잔차가 깔때기 모양으로 점점 넓게 퍼지면 등분산성 가정이 위배된 것이다.", "e": "무작위로 고르게 흩어져야 가정을 만족해요.", "src": "핵심 개념"}, {"id": "s3-110", "subj": 3, "n": 110, "unit": 10, "a": "O", "s": "회귀 분산분석표에서 총제곱합(SST)은 회귀제곱합(SSR)과 잔차제곱합(SSE)의 합이다.", "e": "SST = SSR + SSE, 총 변동 = 설명된 변동 + 설명 못 한 변동이에요.", "src": "50회 변형"}, {"id": "s3-111", "subj": 3, "n": 111, "unit": 10, "a": "X", "s": "단순회귀에서 SSE가 20이고 데이터가 10개이면 MSE는 2.0이다.", "e": "단순회귀의 잔차 자유도는 n − 2 = 8이라 MSE = 20 ÷ 8 = 2.5예요.", "src": "47회 변형"}, {"id": "s3-112", "subj": 3, "n": 112, "unit": 10, "a": "O", "s": "SSR이 300이고 SSE가 200이면 결정계수 R²는 0.6이다.", "e": "SST = 500, R² = SSR / SST = 300 / 500 = 0.6이에요.", "src": "46회 변형"}, {"id": "s3-113", "subj": 3, "n": 113, "unit": 10, "a": "X", "s": "결정계수 R²는 −1에서 1 사이의 값을 가진다.", "e": "R²는 0~1 사이예요. −1~1은 상관계수의 범위예요.", "src": "49회 변형"}, {"id": "s3-114", "subj": 3, "n": 114, "unit": 10, "a": "O", "s": "수정 결정계수는 독립변수 개수를 자유도로 보정해, 무의미한 변수를 넣어도 R²가 커지는 한계를 보완한다.", "e": "수정 R²는 항상 R² 이하이고, 쓸모없는 변수를 넣으면 오히려 줄어들 수 있어요.", "src": "핵심 개념"}, {"id": "s3-115", "subj": 3, "n": 115, "unit": 10, "a": "X", "s": "MAE는 오차를 제곱해 평균한 값이라 큰 오차에 높은 페널티를 준다.", "e": "그건 MSE예요. MAE는 오차 절댓값의 평균이라 이상치에 강건해요.", "src": "핵심 개념"}, {"id": "s3-116", "subj": 3, "n": 116, "unit": 11, "a": "O", "s": "회귀모형 전체의 유의성은 F-검정으로, 개별 회귀계수의 유의성은 t-검정으로 판단한다.", "e": "설명력은 R²·수정 R²로 봐요.", "src": "핵심 개념"}, {"id": "s3-117", "subj": 3, "n": 117, "unit": 11, "a": "X", "s": "설명변수 간 상관계수를 보고 회귀모형의 적합성을 판단한다.", "e": "설명변수 간 상관은 다중공선성 진단이에요. 모형 적합성은 F-검정과 R²로 판단해요.", "src": "48회 변형"}, {"id": "s3-118", "subj": 3, "n": 118, "unit": 11, "a": "O", "s": "독립변수가 3개이고 잔차 자유도가 96이면 데이터 수는 100개이다.", "e": "n = 잔차 자유도 + k + 1 = 96 + 3 + 1 = 100이에요.", "src": "핵심 개념"}, {"id": "s3-119", "subj": 3, "n": 119, "unit": 11, "a": "O", "s": "R의 회귀 출력에서 t value는 Estimate를 Std. Error로 나눈 값이다.", "e": "t값이 크면 p-value(Pr(>|t|))가 작아져요.", "src": "핵심 개념"}, {"id": "s3-120", "subj": 3, "n": 120, "unit": 11, "a": "X", "s": "어떤 회귀계수의 p-value가 0.869이면 유의수준 5%에서 유의한 변수이다.", "e": "0.869 > 0.05이므로 유의하지 않아요. 별표(*)도 붙지 않아요.", "src": "핵심 개념"}, {"id": "s3-121", "subj": 3, "n": 121, "unit": 11, "a": "O", "s": "Multiple R-squared가 0.2775이면 모형이 종속변수 변동의 약 27.75%를 설명한다.", "e": "R²는 전체 변동 중 회귀모형이 설명하는 비율이에요.", "src": "50회 변형"}, {"id": "s3-122", "subj": 3, "n": 122, "unit": 11, "a": "X", "s": "다중회귀에서 F 통계량의 자유도는 (n − 1, k)이다.", "e": "F의 자유도는 (k, n − k − 1)이에요. 예 : 3 and 96 DF", "src": "핵심 개념"}, {"id": "s3-123", "subj": 3, "n": 123, "unit": 11, "a": "O", "s": "다중회귀계수는 다른 독립변수가 고정되었을 때 해당 변수가 1단위 증가하면 종속변수의 평균이 얼마나 변하는지를 나타낸다.", "e": "'다른 조건이 같다면', '평균적으로'가 붙은 해석이 옳아요.", "src": "50회 변형"}, {"id": "s3-124", "subj": 3, "n": 124, "unit": 11, "a": "X", "s": "추정된 회귀식이 ŷ = 8.8x + 27.5일 때 x = 10이면 예측값은 36.3이다.", "e": "8.8 × 10 + 27.5 = 115.5예요. 계수에 x를 곱해야 해요.", "src": "핵심 개념"}, {"id": "s3-125", "subj": 3, "n": 125, "unit": 11, "a": "O", "s": "학생 여부(Yes/No) 같은 명목형 변수는 0/1 더미변수로 바꾸어 회귀모형에 넣을 수 있다.", "e": "출력에 없는 범주(No)가 기준 범주예요.", "src": "50회 변형"}, {"id": "s3-126", "subj": 3, "n": 126, "unit": 11, "a": "X", "s": "출력에 income:studentYes 같은 교호작용 항이 없어도, 수입의 효과가 학생 여부에 따라 다르다고 해석할 수 있다.", "e": "교호작용 항이 없으면 두 집단의 기울기는 같고 절편만 달라요.", "src": "50회 변형"}, {"id": "s3-127", "subj": 3, "n": 127, "unit": 11, "a": "X", "s": "회귀계수가 통계적으로 유의하면 독립변수와 종속변수 사이에 인과관계가 있다고 단정할 수 있다.", "e": "회귀분석 결과만으로 인과관계를 단정할 수 없어요.", "src": "44회 변형"}, {"id": "s3-128", "subj": 3, "n": 128, "unit": 11, "a": "X", "s": "모형 전체의 F-검정이 유의하면 모든 개별 회귀계수도 유의하다.", "e": "개별 계수는 각자의 t-검정 p-value로 따로 판단해요.", "src": "핵심 개념"}, {"id": "s3-129", "subj": 3, "n": 129, "unit": 11, "a": "O", "s": "종속변수가 이항분포를 따를 때 로짓(logit) 연결 함수를 쓰는 일반화 선형 모형(GLM)이 로지스틱 회귀이다.", "e": "정규분포 → Identity(선형 회귀), 포아송분포 → Log(포아송 회귀)예요.", "src": "핵심 개념"}, {"id": "s3-130", "subj": 3, "n": 130, "unit": 12, "a": "O", "s": "다중공선성은 회귀분석에서 독립변수들 사이에 강한 상관관계가 나타나는 문제이다.", "e": "회귀계수 추정이 불안정해지고 계수의 분산이 커져요.", "src": "44회 변형"}, {"id": "s3-131", "subj": 3, "n": 131, "unit": 12, "a": "X", "s": "다중공선성이 있어도 회귀계수의 분산은 항상 동일하게 유지된다.", "e": "다중공선성이 있으면 회귀계수의 분산이 팽창해요.", "src": "47회 변형"}, {"id": "s3-132", "subj": 3, "n": 132, "unit": 12, "a": "O", "s": "다중공선성은 VIF(분산팽창지수)로 측정할 수 있다.", "e": "흔히 VIF 10 이상(엄격하게는 5 이상)이면 의심해요.", "src": "47회 변형"}, {"id": "s3-133", "subj": 3, "n": 133, "unit": 12, "a": "X", "s": "j번째 변수의 VIF는 1 / Rj²로 계산한다.", "e": "VIFj = 1 / (1 − Rj²)예요. Rj²는 j번째 변수를 나머지 독립변수로 회귀한 결정계수예요.", "src": "핵심 개념"}, {"id": "s3-134", "subj": 3, "n": 134, "unit": 12, "a": "O", "s": "j번째 변수를 나머지 독립변수로 회귀한 결정계수 Rj²가 0.9이면 VIF는 10이다.", "e": "1 / (1 − 0.9) = 1 / 0.1 = 10이에요.", "src": "핵심 개념"}, {"id": "s3-135", "subj": 3, "n": 135, "unit": 12, "a": "X", "s": "VIF가 1이면 해당 변수의 다중공선성이 매우 심하다는 뜻이다.", "e": "VIF = 1은 다른 변수와 전혀 겹치지 않는 상태예요. 값이 클수록 심해요.", "src": "핵심 개념"}, {"id": "s3-136", "subj": 3, "n": 136, "unit": 12, "a": "O", "s": "회귀분석에서 VIF가 8.2인 변수는 다중공선성을 의심하고 변수 제거나 통합을 고려할 수 있다.", "e": "48회 다중공선성 해석 유형(야구선수 연봉 회귀)에서 나온 사례예요.", "src": "48회 변형"}, {"id": "s3-137", "subj": 3, "n": 137, "unit": 12, "a": "X", "s": "로지스틱 회귀는 다중공선성의 해결 방안이다.", "e": "로지스틱 회귀는 범주형 종속변수를 위한 분류 모델이에요. 해결 방안은 변수 제거·PCA·규제 회귀예요.", "src": "47회 변형"}, {"id": "s3-138", "subj": 3, "n": 138, "unit": 12, "a": "O", "s": "주성분분석(PCA)은 상관관계가 높은 변수들을 선형결합으로 축약해 다중공선성을 완화할 수 있다.", "e": "서로 상관없는 주성분으로 바꾸면 다중공선성이 줄어요.", "src": "핵심 개념"}, {"id": "s3-139", "subj": 3, "n": 139, "unit": 12, "a": "X", "s": "릿지(L2) 회귀는 불필요한 회귀계수를 정확히 0으로 만들어 변수를 선택한다.", "e": "계수를 0으로 만들어 변수 선택까지 하는 건 라쏘(L1)예요. 릿지는 0에 가깝게 줄이지만 0으로 만들지는 않아요.", "src": "핵심 개념"}, {"id": "s3-140", "subj": 3, "n": 140, "unit": 12, "a": "O", "s": "라쏘(L1) 회귀는 가중치 절댓값의 합에 페널티를 준다.", "e": "절댓값 → L1 → 라쏘, 제곱 → L2 → 릿지예요. 둘을 함께 쓰면 엘라스틱넷이에요.", "src": "핵심 개념"}, {"id": "s3-141", "subj": 3, "n": 141, "unit": 12, "a": "X", "s": "후진제거법은 변수가 없는 모형에서 시작해 설명력이 좋은 변수를 하나씩 추가하는 방법이다.", "e": "그건 전진선택법이에요. 후진제거법은 모든 변수를 넣은 모형에서 하나씩 제거해요.", "src": "45회 변형"}, {"id": "s3-142", "subj": 3, "n": 142, "unit": 12, "a": "X", "s": "교차검증법은 전진선택·후진제거·단계별 선택과 같은 변수 선택법의 하나이다.", "e": "교차검증은 모형 성능 평가 방법이에요. 변수 선택법은 전진선택·후진제거·단계별 선택이에요.", "src": "핵심 개념"}, {"id": "s3-143", "subj": 3, "n": 143, "unit": 12, "a": "O", "s": "과적합된 모형은 훈련 데이터의 오차는 작지만 검증 데이터의 오차는 크다.", "e": "과적합 대책은 규제 추가예요.", "src": "핵심 개념"}, {"id": "s3-144", "subj": 3, "n": 144, "unit": 13, "a": "O", "s": "주성분분석(PCA)은 상관관계가 높은 변수들을 선형결합해 차원을 축소하는 방법이다.", "e": "새로 만든 변수를 주성분이라고 해요.", "src": "45회 변형"}, {"id": "s3-145", "subj": 3, "n": 145, "unit": 13, "a": "X", "s": "주성분분석은 변수 간 선형관계를 알아보기 위한 분석이다.", "e": "PCA의 목적은 차원 축소예요.", "src": "44회 변형"}, {"id": "s3-146", "subj": 3, "n": 146, "unit": 13, "a": "O", "s": "주성분분석은 목표변수 없이 수행하는 비지도 학습이다.", "e": "변수들끼리의 퍼짐만 보고 축을 찾아요.", "src": "46회 변형"}, {"id": "s3-147", "subj": 3, "n": 147, "unit": 13, "a": "X", "s": "주성분들 사이에는 상관관계가 있다.", "e": "주성분끼리는 서로 직교하며 상관관계가 없어요.", "src": "45회 변형"}, {"id": "s3-148", "subj": 3, "n": 148, "unit": 13, "a": "X", "s": "주성분은 번호가 뒤로 갈수록 설명하는 분산이 커진다.", "e": "PC1 ≥ PC2 ≥ PC3 … 뒤로 갈수록 설명 분산이 작아져요.", "src": "48회 변형"}, {"id": "s3-149", "subj": 3, "n": 149, "unit": 13, "a": "X", "s": "관측치가 1,000개이고 변수가 10개이면 주성분은 최대 1,000개까지 만들 수 있다.", "e": "주성분의 최대 개수는 변수 개수(10개)예요.", "src": "46회 변형"}, {"id": "s3-150", "subj": 3, "n": 150, "unit": 13, "a": "O", "s": "제1주성분은 데이터의 분산이 가장 큰 방향의 축이다.", "e": "분산이 클수록 정보를 많이 담고 있어요.", "src": "핵심 개념"}, {"id": "s3-151", "subj": 3, "n": 151, "unit": 13, "a": "O", "s": "R의 summary(prcomp()) 출력에서 Standard deviation을 제곱하면 해당 주성분의 고윳값이 된다.", "e": "예 : 1.5749² ≈ 2.48이에요.", "src": "핵심 개념"}, {"id": "s3-152", "subj": 3, "n": 152, "unit": 13, "a": "O", "s": "PCA 출력에서 7번째 주성분까지의 누적 기여율이 94.5%라면 원래 변수는 7개보다 많다.", "e": "모든 주성분의 누적 기여율은 100%라서 표에 안 나온 주성분이 더 있어요.", "src": "50회 변형"}, {"id": "s3-153", "subj": 3, "n": 153, "unit": 13, "a": "X", "s": "2번째 주성분까지 누적 기여율이 86.75%이면, 주성분 2개만 쓸 때 잃는 정보는 86.75%이다.", "e": "잃는 정보는 100 − 86.75 = 13.25%예요.", "src": "50회 변형"}, {"id": "s3-154", "subj": 3, "n": 154, "unit": 13, "a": "O", "s": "주성분 개수는 누적 기여율 70~90% 또는 고윳값 1 이상을 기준으로 정할 수 있다.", "e": "스크리 도표의 팔꿈치도 기준으로 써요.", "src": "48회 변형"}, {"id": "s3-155", "subj": 3, "n": 155, "unit": 13, "a": "X", "s": "스크리 도표에서는 기울기가 가장 가파른 지점까지의 주성분만 사용한다.", "e": "기울기가 완만해지기 직전(팔꿈치)까지의 주성분 수를 선택해요.", "src": "47회 변형"}, {"id": "s3-156", "subj": 3, "n": 156, "unit": 13, "a": "O", "s": "바이플롯에서 두 변수의 화살표가 서로 가까우면 두 변수의 상관관계가 높다.", "e": "화살표가 길수록 분산이 크고, 축과 평행할수록 그 주성분에 영향이 커요.", "src": "핵심 개념"}, {"id": "s3-157", "subj": 3, "n": 157, "unit": 13, "a": "O", "s": "표준화한 두 변수 A, B의 상관계수가 양수이면 제1주성분은 (A + B)/√2 방향이다.", "e": "r > 0이면 합 방향(고윳값 1 + r)이 제1주성분이에요. 부호를 모두 뒤집어도 같은 축이에요.", "src": "50회 변형"}, {"id": "s3-158", "subj": 3, "n": 158, "unit": 13, "a": "X", "s": "표준화한 두 변수 A, B의 상관계수가 0.1일 때 마지막 주성분은 (A + B)/√2이다.", "e": "r > 0이면 마지막 주성분은 차 방향 (A − B)/√2예요.", "src": "50회 변형"}, {"id": "s3-159", "subj": 3, "n": 159, "unit": 14, "a": "O", "s": "다차원척도법(MDS)은 개체 간 거리나 유사도를 2·3차원 공간에 점으로 나타내 시각화한다.", "e": "비슷한 개체는 가깝게, 다른 개체는 멀게 배치해요.", "src": "핵심 개념"}, {"id": "s3-160", "subj": 3, "n": 160, "unit": 14, "a": "X", "s": "다차원척도법의 결과 지도에서는 개체의 절대적 위치를 알 수 있다.", "e": "지도를 돌리거나 뒤집어도 같아요. 상대적 거리만 의미가 있어요.", "src": "45회 변형"}, {"id": "s3-161", "subj": 3, "n": 161, "unit": 14, "a": "X", "s": "다차원척도법의 주된 목적은 비유사성을 이용해 동질적인 그룹(군집)을 형성하는 것이다.", "e": "그룹 만들기는 군집분석의 일이에요. MDS의 목적은 시각화예요.", "src": "49회 변형"}, {"id": "s3-162", "subj": 3, "n": 162, "unit": 14, "a": "O", "s": "영화 간 유사성을 지도로 시각화하는 것은 다차원척도법의 활용 사례이다.", "e": "매출·집값 예측은 회귀분석이에요.", "src": "46회 변형"}, {"id": "s3-163", "subj": 3, "n": 163, "unit": 14, "a": "O", "s": "계량적 MDS는 구간·비율척도 자료에, 비계량적 MDS는 순서척도 자료에 사용한다.", "e": "순위만 있는 자료면 비계량적 MDS예요.", "src": "49회 변형"}, {"id": "s3-164", "subj": 3, "n": 164, "unit": 14, "a": "X", "s": "MDS의 스트레스(Stress) 값은 클수록 적합도가 높다.", "e": "스트레스는 0에 가까울수록 적합도가 높아요.", "src": "핵심 개념"}, {"id": "s3-165", "subj": 3, "n": 165, "unit": 14, "a": "O", "s": "두 점 A(1, 2)와 B(4, 6) 사이의 유클리드 거리는 5이다.", "e": "√(3² + 4²) = √25 = 5예요.", "src": "핵심 개념"}, {"id": "s3-166", "subj": 3, "n": 166, "unit": 14, "a": "X", "s": "두 점 A(1, 2)와 B(4, 6) 사이의 맨해튼 거리는 5이다.", "e": "|1 − 4| + |2 − 6| = 3 + 4 = 7이에요.", "src": "핵심 개념"}, {"id": "s3-167", "subj": 3, "n": 167, "unit": 14, "a": "X", "s": "맨해튼 거리는 항상 유클리드 거리보다 작거나 같다.", "e": "부등호가 거꾸로예요. 맨해튼 거리 ≥ 유클리드 거리예요.", "src": "49회 변형"}, {"id": "s3-168", "subj": 3, "n": 168, "unit": 14, "a": "O", "s": "체비셰프 거리는 변수별 차이의 절댓값 중 최댓값이다.", "e": "A(1, 2), B(4, 6)이면 Max(3, 4) = 4예요.", "src": "핵심 개념"}, {"id": "s3-169", "subj": 3, "n": 169, "unit": 14, "a": "O", "s": "민코프스키 거리에서 p = 1이면 맨해튼 거리, p = 2이면 유클리드 거리가 된다.", "e": "민코프스키는 차수 p를 정해 쓰는 일반형이에요.", "src": "핵심 개념"}, {"id": "s3-170", "subj": 3, "n": 170, "unit": 14, "a": "X", "s": "표준화 거리는 변수 간 상관관계까지 반영하는 통계적 거리이다.", "e": "상관관계까지 반영하는 건 마할라노비스 거리예요. 표준화 거리는 단위(스케일)만 맞춰요.", "src": "44·48회 변형"}, {"id": "s3-171", "subj": 3, "n": 171, "unit": 14, "a": "X", "s": "자카드 거리는 연속형 변수 간 거리를 측정하는 데 적합하다.", "e": "자카드는 집합(범주형) 데이터용이에요.", "src": "45회 변형"}, {"id": "s3-172", "subj": 3, "n": 172, "unit": 14, "a": "O", "s": "A = {빵, 계란, 우유}, B = {우유, 사과, 주스}의 자카드 유사도는 0.2이다.", "e": "교집합 1개 ÷ 합집합 5개 = 0.2예요.", "src": "핵심 개념"}, {"id": "s3-173", "subj": 3, "n": 173, "unit": 15, "a": "O", "s": "정상 시계열은 평균과 분산이 모든 시점에서 일정하다.", "e": "특정한 추세가 없는 안정된 상태예요.", "src": "핵심 개념"}, {"id": "s3-174", "subj": 3, "n": 174, "unit": 15, "a": "X", "s": "정상 시계열에서 두 시점 사이의 공분산은 시점에 의존한다.", "e": "공분산은 시점이 아니라 시차(Lag)에만 의존해요.", "src": "46회 변형"}, {"id": "s3-175", "subj": 3, "n": 175, "unit": 15, "a": "X", "s": "정상 시계열의 각 관측값은 서로 독립이다.", "e": "시계열 관측값은 보통 자기상관이 있어 서로 독립이 아니에요.", "src": "49회 변형"}, {"id": "s3-176", "subj": 3, "n": 176, "unit": 15, "a": "O", "s": "평균이 일정하지 않은(추세가 있는) 시계열은 차분을 통해 정상 시계열로 만든다.", "e": "차분 : Δyt = yt − yt−1이에요.", "src": "47·50회 변형"}, {"id": "s3-177", "subj": 3, "n": 177, "unit": 15, "a": "O", "s": "분산이 일정하지 않은 시계열은 로그 변환이나 Box-Cox 변환을 사용한다.", "e": "변동 폭을 조절해 분산을 안정시켜요.", "src": "47·50회 변형"}, {"id": "s3-178", "subj": 3, "n": 178, "unit": 15, "a": "X", "s": "정규화(표준화)는 비정상 시계열을 정상 시계열로 만드는 방법이다.", "e": "정규화는 스케일만 바꿀 뿐 추세는 그대로라 정상화 방법이 아니에요.", "src": "44·45회 변형"}, {"id": "s3-179", "subj": 3, "n": 179, "unit": 15, "a": "O", "s": "계절성이 있는 시계열은 계절 차분으로 정상성에 가깝게 만들 수 있다.", "e": "1년 전 같은 달의 값을 빼는 방식이에요.", "src": "핵심 개념"}, {"id": "s3-180", "subj": 3, "n": 180, "unit": 15, "a": "X", "s": "백색잡음은 대표적인 비정상 시계열이다.", "e": "백색잡음은 평균 0·분산 일정·자기상관 없음이라 대표적인 정상 시계열이에요.", "src": "47회 변형"}, {"id": "s3-181", "subj": 3, "n": 181, "unit": 15, "a": "O", "s": "백색잡음은 평균이 0이고 분산이 일정하며 시점 간 자기상관이 없다.", "e": "시계열 모형의 오차항이에요.", "src": "핵심 개념"}, {"id": "s3-182", "subj": 3, "n": 182, "unit": 15, "a": "X", "s": "순환 요인은 요일·월·분기처럼 고정된 주기로 반복되는 변화이다.", "e": "고정된 주기는 계절 요인이에요. 순환 요인은 알려지지 않은 주기의 변화예요.", "src": "44·45회 변형"}, {"id": "s3-183", "subj": 3, "n": 183, "unit": 15, "a": "X", "s": "분해시계열의 요인은 추세·계절·순환·규칙 요인이다.", "e": "'규칙 요인'은 없어요. 네 번째는 불규칙 요인이에요.", "src": "48회 변형"}, {"id": "s3-184", "subj": 3, "n": 184, "unit": 15, "a": "O", "s": "경기 호황·불황처럼 주기가 일정하지 않은 긴 파동은 순환 요인에 해당한다.", "e": "계절 = 고정 주기, 순환 = 알려지지 않은 주기예요.", "src": "핵심 개념"}, {"id": "s3-185", "subj": 3, "n": 185, "unit": 15, "a": "O", "s": "지수평활법은 모든 과거 자료를 사용하되 최근 관측치에 더 높은 가중치를 준다.", "e": "이동평균법은 일정 기간의 관측치에 동일한 가중치를 줘요.", "src": "핵심 개념"}, {"id": "s3-186", "subj": 3, "n": 186, "unit": 15, "a": "X", "s": "지수평활법은 비정상 시계열을 정상 시계열로 만드는 정상화 방법이다.", "e": "지수평활법은 예측 기법이에요. 정상화 방법은 차분·변환이에요.", "src": "48회 변형"}, {"id": "s3-187", "subj": 3, "n": 187, "unit": 16, "a": "O", "s": "AR, MA, ARMA 모형은 모두 정상성을 가정한다.", "e": "차분이 필요한 비정상 자료는 ARIMA로 다뤄요.", "
