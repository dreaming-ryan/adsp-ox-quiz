src": "50회 변형"}, {"id": "s3-188", "subj": 3, "n": 188, "unit": 16, "a": "O", "s": "AR(p) 모형은 현재 값을 자기 자신의 과거 관측값들과 현재의 백색잡음으로 설명한다.", "e": "Zt = φ₁Zt−1 + … + φpZt−p + at예요.", "src": "50회 변형"}, {"id": "s3-189", "subj": 3, "n": 189, "unit": 16, "a": "X", "s": "MA 모형은 과거 관측값들의 선형결합으로 현재 값을 설명한다.", "e": "MA는 현재와 과거의 오차항(백색잡음)의 선형결합이에요. 과거 관측값을 쓰는 건 AR이에요.", "src": "50회 변형"}, {"id": "s3-190", "subj": 3, "n": 190, "unit": 16, "a": "X", "s": "MA 모형은 비정상 시계열에만 사용하는 모형이다.", "e": "MA는 정상 시계열 모형이에요.", "src": "50회 변형"}, {"id": "s3-191", "subj": 3, "n": 191, "unit": 16, "a": "O", "s": "MA 모형은 유한 개 백색잡음의 결합이므로 항상 정상성을 만족한다.", "e": "AR과 달리 MA는 늘 정상이에요.", "src": "핵심 개념"}, {"id": "s3-192", "subj": 3, "n": 192, "unit": 16, "a": "O", "s": "ARIMA(p, d, q)에서 d는 차분 횟수를 뜻한다.", "e": "p = AR 차수, d = 차분 횟수, q = MA 차수예요.", "src": "핵심 개념"}, {"id": "s3-193", "subj": 3, "n": 193, "unit": 16, "a": "X", "s": "ARIMA 모형에서는 자기회귀 차수 p를 먼저 정한 뒤 차분 차수 d를 정한다.", "e": "정상성 확보를 위해 차분 차수 d를 먼저 정하고, 그다음 p와 q를 정해요.", "src": "47회 변형"}, {"id": "s3-194", "subj": 3, "n": 194, "unit": 16, "a": "O", "s": "ARIMA(p, 0, q)는 ARMA(p, q)와 같다.", "e": "차분이 없으면(d = 0) ARMA예요.", "src": "핵심 개념"}, {"id": "s3-195", "subj": 3, "n": 195, "unit": 16, "a": "X", "s": "ARIMA(0, 0, q)는 AR(q) 모형이다.", "e": "AR 차수 p = 0이고 MA 차수만 있으므로 MA(q)예요.", "src": "핵심 개념"}, {"id": "s3-196", "subj": 3, "n": 196, "unit": 16, "a": "O", "s": "ARIMA(3, 2, 4)는 두 번 차분하면 ARMA(3, 4)가 된다.", "e": "d = 2이므로 두 번 차분해요.", "src": "핵심 개념"}, {"id": "s3-197", "subj": 3, "n": 197, "unit": 16, "a": "X", "s": "ARMA 모형은 반드시 차분한 자료에만 사용한다.", "e": "ARMA는 정상 시계열에 바로 써요. 차분이 필요한 건 ARIMA예요.", "src": "50회 변형"}, {"id": "s3-198", "subj": 3, "n": 198, "unit": 16, "a": "O", "s": "AR(p) 모형은 PACF가 (p+1)차 항부터 절단되고, ACF는 완만하게 감소한다.", "e": "끊기는 쪽이 PACF면 AR, ACF면 MA예요.", "src": "핵심 개념"}, {"id": "s3-199", "subj": 3, "n": 199, "unit": 16, "a": "X", "s": "MA(q) 모형은 PACF가 (q+1)차 항부터 절단된다.", "e": "MA(q)는 ACF가 (q+1)차부터 절단되고 PACF는 완만하게 감소해요.", "src": "핵심 개념"}, {"id": "s3-200", "subj": 3, "n": 200, "unit": 16, "a": "O", "s": "ACF는 완만하게 감소하고, PACF는 유의성 한계선을 넘는 마지막 막대가 시차 3이며 4차부터 절단되면 AR(3) 모형이 적합하다.", "e": "AR(3) = ARMA(3, 0)이에요.", "src": "50회 변형"}, {"id": "s3-201", "subj": 3, "n": 201, "unit": 17, "a": "O", "s": "데이터 마이닝은 목적 설정 → 데이터 준비 → 데이터 가공 → 기법 적용 → 검증 순서로 진행한다.", "e": "준비(모으기)가 가공(다듬기)보다 먼저예요.", "src": "46·48회 변형"}, {"id": "s3-202", "subj": 3, "n": 202, "unit": 17, "a": "X", "s": "모델링 기법에 맞게 변수를 정의하고 소프트웨어에 넣을 수 있는 형식으로 변환하는 것은 데이터 준비 단계의 작업이다.", "e": "그건 데이터 가공 단계예요. 데이터 준비는 데이터를 모으고 정제하며 충분한 규모를 확보하는 단계예요.", "src": "핵심 개념"}, {"id": "s3-203", "subj": 3, "n": 203, "unit": 17, "a": "O", "s": "군집분석·주성분분석·연관분석은 정답(반응변수) 없이 수행하는 비지도학습이다.", "e": "회귀·로지스틱·의사결정나무·SVM·신경망·kNN은 지도학습이에요.", "src": "핵심 개념"}, {"id": "s3-204", "subj": 3, "n": 204, "unit": 17, "a": "X", "s": "로지스틱 회귀는 이름에 '회귀'가 붙어 있으므로 분류 모형이 아니다.", "e": "로지스틱 회귀는 범주형 종속변수를 예측하는 분류 모형이에요.", "src": "49회 변형"}, {"id": "s3-205", "subj": 3, "n": 205, "unit": 17, "a": "X", "s": "의사결정나무는 설명이 어려운 블랙박스 모형이다.", "e": "의사결정나무는 해석이 쉬운 화이트박스 모형이에요. 신경망·앙상블이 블랙박스예요.", "src": "48회 변형"}, {"id": "s3-206", "subj": 3, "n": 206, "unit": 17, "a": "O", "s": "데이터를 훈련용·검증용·평가용으로 나눌 때 일반적으로 훈련용에 가장 많은 비율을 배정한다.", "e": "보통 훈련 50% · 검증 30% · 평가 20% 정도로 나눠요.", "src": "50회 변형"}, {"id": "s3-207", "subj": 3, "n": 207, "unit": 17, "a": "X", "s": "검증용(Validation) 데이터로 모델의 최종 성능을 평가한다.", "e": "최종 성능은 학습에 쓰지 않은 평가용(Test) 데이터로 평가해요. 검증용은 과적합 조정·Early Stopping에 써요.", "src": "48회 변형"}, {"id": "s3-208", "subj": 3, "n": 208, "unit": 17, "a": "O", "s": "K-fold 교차검증은 데이터를 k개로 나눠 k−1개로 학습하고 1개로 검증하는 과정을 k번 반복해 결과를 평균한다.", "e": "한 번 나눈 결과의 우연에 휘둘리지 않게 해 줘요.", "src": "핵심 개념"}, {"id": "s3-209", "subj": 3, "n": 209, "unit": 17, "a": "X", "s": "LOOCV는 관측값 1개만 훈련에 쓰고 나머지 n−1개로 검증하는 방법이다.", "e": "반대예요. 1개만 검증용, 나머지 n−1개로 훈련하며 n번 학습해요.", "src": "핵심 개념"}, {"id": "s3-210", "subj": 3, "n": 210, "unit": 17, "a": "X", "s": "과대적합된 모형은 훈련 오차와 검증 오차가 모두 높다.", "e": "그건 과소적합이에요. 과대적합은 훈련 오차는 낮고 검증 오차가 높아요.", "src": "핵심 개념"}, {"id": "s3-211", "subj": 3, "n": 211, "unit": 17, "a": "O", "s": "모든 범주를 전반적으로 잘 못 맞히면 과소적합, 특정 소수 범주만 제대로 못 맞히면 범주 불균형 문제이다.", "e": "범주 불균형은 오버·언더샘플링, 층화 분할, 가중치 조정으로 다뤄요.", "src": "50회 변형"}, {"id": "s3-212", "subj": 3, "n": 212, "unit": 18, "a": "O", "s": "로지스틱 회귀는 종속변수가 성공/실패처럼 두 범주로 나뉠 때 쓰는 분류 모형이다.", "e": "합격/불합격, 연체 여부, 질병 양성/음성 같은 이진 분류에 적합해요.", "src": "45·48회 변형"}, {"id": "s3-213", "subj": 3, "n": 213, "unit": 18, "a": "X", "s": "주택 가격 예측은 로지스틱 회귀의 적합한 적용 사례이다.", "e": "주택 가격은 연속형 숫자라 선형회귀 대상이에요.", "src": "45회 변형"}, {"id": "s3-214", "subj": 3, "n": 214, "unit": 18, "a": "X", "s": "로지스틱 회귀의 회귀계수는 최소제곱법으로 추정한다.", "e": "로지스틱 회귀는 최대우도추정법으로 계수를 추정해요.", "src": "핵심 개념"}, {"id": "s3-215", "subj": 3, "n": 215, "unit": 18, "a": "O", "s": "오즈(Odds)는 성공 확률을 실패 확률로 나눈 값, p / (1 − p)이다.", "e": "범위는 0 ~ ∞예요.", "src": "48회 변형"}, {"id": "s3-216", "subj": 3, "n": 216, "unit": 18, "a": "X", "s": "성공 확률이 0.8이면 오즈는 0.8이다.", "e": "오즈 = 0.8 / 0.2 = 4예요. 성공이 실패보다 4배 잘 일어난다는 뜻이에요.", "src": "핵심 개념"}, {"id": "s3-217", "subj": 3, "n": 217, "unit": 18, "a": "O", "s": "로짓은 오즈에 자연로그를 취한 값으로, 독립변수와 선형 관계를 가진다.", "e": "로짓 = ln(p/(1−p)) = β₀ + β₁x, 범위는 −∞ ~ +∞예요.", "src": "48회 변형"}, {"id": "s3-218", "subj": 3, "n": 218, "unit": 18, "a": "X", "s": "로지스틱 회귀의 연결함수는 시그모이드 함수이다.", "e": "연결함수는 로짓이에요. 시그모이드는 로짓의 역함수예요.", "src": "48회 변형"}, {"id": "s3-219", "subj": 3, "n": 219, "unit": 18, "a": "O", "s": "시그모이드 함수 1 / (1 + e⁻ᶻ)에 z = 0을 넣으면 확률 0.5가 나온다.", "e": "z가 커질수록 확률이 커지는 단조증가 S자 곡선이에요.", "src": "핵심 개념"}, {"id": "s3-220", "subj": 3, "n": 220, "unit": 18, "a": "X", "s": "로지스틱 회귀에서 x가 1 증가하면 오즈는 β만큼 증가한다.", "e": "x가 1 증가하면 로짓이 β만큼 증가하고, 오즈는 e^β배가 돼요.", "src": "50회 변형"}, {"id": "s3-221", "subj": 3, "n": 221, "unit": 18, "a": "O", "s": "로지스틱 회귀계수 β가 0이면 x가 변해도 오즈는 변하지 않는다.", "e": "e⁰ = 1배라서 영향이 없어요.", "src": "핵심 개념"}, {"id": "s3-222", "subj": 3, "n": 222, "unit": 18, "a": "X", "s": "R에서 glm(y ~ x, family = binomial)로 적합한 모형은 포아송 회귀이다.", "e": "family = binomial(이항분포)이면 로지스틱 회귀예요. 포아송 회귀는 family = poisson이에요.", "src": "50회 변형"}, {"id": "s3-223", "subj": 3, "n": 223, "unit": 19, "a": "O", "s": "의사결정나무는 자식마디의 순수도가 증가(불순도가 감소)하는 방향으로 분리한다.", "e": "아래로 내려갈수록 한 종류끼리 모여요.", "src": "45·48회 변형"}, {"id": "s3-224", "subj": 3, "n": 224, "unit": 19, "a": "X", "s": "의사결정나무에서 현재의 분할은 이전 분할의 영향을 받지 않는다.", "e": "위에서 어떻게 나눴느냐에 따라 아래 질문이 달라져요. 현재 분할은 이전 분할의 영향을 받아요.", "src": "핵심 개념"}, {"id": "s3-225", "subj": 3, "n": 225, "unit": 19, "a": "O", "s": "CART는 범주형 목표변수의 분리 기준으로 지니 지수를 사용한다.", "e": "C4.5·C5.0은 엔트로피, CHAID는 카이제곱 통계량을 써요.", "src": "핵심 개념"}, {"id": "s3-226", "subj": 3, "n": 226, "unit": 19, "a": "X", "s": "C4.5 알고리즘은 분리 기준으로 카이제곱 통계량을 사용한다.", "e": "C4.5는 엔트로피 지수를 써요. 카이제곱 통계량은 CHAID예요.", "src": "핵심 개념"}, {"id": "s3-227", "subj": 3, "n": 227, "unit": 19, "a": "X", "s": "의사결정나무는 지니 지수가 최대가 되는 방향으로 분리한다.", "e": "지니 지수는 불순도라 작아지는 방향으로 분리해요.", "src": "49회 변형"}, {"id": "s3-228", "subj": 3, "n": 228, "unit": 19, "a": "O", "s": "연속형 목표변수에서 CART는 분산 감소량이 커지는 방향으로 분리한다.", "e": "분산 감소량·카이제곱 통계량·F-통계량은 클수록 좋아요.", "src": "핵심 개념"}, {"id": "s3-229", "subj": 3, "n": 229, "unit": 19, "a": "O", "s": "Good 20개, Bad 30개로 이루어진 마디의 지니 지수는 0.48이다.", "e": "1 − (0.4² + 0.6²) = 1 − 0.52 = 0.48이에요.", "src": "44회 변형"}, {"id": "s3-230", "subj": 3, "n": 230, "unit": 19, "a": "X", "s": "지니 지수가 낮아질수록 불순도는 높아진다.", "e": "지니 지수 자체가 불순도 지표예요. 낮아질수록 불순도도 낮아져요.", "src": "50회 변형"}, {"id": "s3-231", "subj": 3, "n": 231, "unit": 19, "a": "O", "s": "한 클래스로만 이루어진 순수 노드의 지니 지수와 엔트로피는 모두 0이다.", "e": "두 클래스가 반반이면 지니 0.5, 엔트로피 1로 최대예요.", "src": "49회 변형"}, {"id": "s3-232", "subj": 3, "n": 232, "unit": 19, "a": "X", "s": "분리했을 때의 정보이득이 임계값을 초과하면 나무의 성장을 멈춘다.", "e": "정보이득이 임계값보다 작을 때 멈춰요.", "src": "50회 변형"}, {"id": "s3-233", "subj": 3, "n": 233, "unit": 19, "a": "X", "s": "가지치기의 목적은 학습 데이터에 대한 정확도를 높이는 것이다.", "e": "가지치기는 과대적합을 막아 새 데이터에 대한 일반화 성능을 높여요. 학습 정확도는 오히려 조금 낮아질 수 있어요.", "src": "45회 변형"}, {"id": "s3-234", "subj": 3, "n": 234, "unit": 19, "a": "O", "s": "의사결정나무는 범주형·수치형 변수를 모두 사용할 수 있고 구조가 단순해 해석이 쉽다.", "e": "단점은 새 자료에 대한 과대적합, 경계선 부근의 큰 오차예요.", "src": "핵심 개념"}, {"id": "s3-235", "subj": 3, "n": 235, "unit": 20, "a": "O", "s": "앙상블은 여러 모형의 예측 결과를 조합해 하나의 최종 결과를 만드는 방법이다.", "e": "분류는 보팅(다수결), 회귀는 평균으로 집계해요.", "src": "핵심 개념"}, {"id": "s3-236", "subj": 3, "n": 236, "unit": 20, "a": "X", "s": "앙상블은 결합하는 모델 간 상관관계가 높을수록 정확도가 향상된다.", "e": "상관관계가 낮은(서로 다른) 모형을 결합할 때 효과가 커요.", "src": "50회 변형"}, {"id": "s3-237", "subj": 3, "n": 237, "unit": 20, "a": "X", "s": "앙상블 모형은 단일 모형보다 결과를 해석하기 쉽다.", "e": "여러 모형을 합쳐 블랙박스가 되므로 해석은 오히려 어려워져요.", "src": "49회 변형"}, {"id": "s3-238", "subj": 3, "n": 238, "unit": 20, "a": "O", "s": "배깅은 부트스트랩 표본마다 모델을 독립적으로(병렬) 학습한 뒤 보팅으로 집계한다.", "e": "Bagging = Bootstrap Aggregating이에요.", "src": "45회 변형"}, {"id": "s3-239", "subj": 3, "n": 239, "unit": 20, "a": "O", "s": "크기 d인 자료에서 d번 복원추출할 때 특정 관측치가 한 번도 뽑히지 않을 확률은 (1 − 1/d)^d이다.", "e": "d가 커지면 약 e⁻¹ ≈ 36.8%예요. 1 − (1 − 1/d)^d는 적어도 한 번 뽑힐 확률이에요.", "src": "44·50회 변형"}, {"id": "s3-240", "subj": 3, "n": 240, "unit": 20, "a": "X", "s": "d가 충분히 크면 부트스트랩 표본에 한 번도 뽑히지 않는 데이터의 비율은 약 63.2%이다.", "e": "안 뽑히는 비율은 약 36.8%(OOB)이고, 약 63.2%가 표본에 포함돼요.", "src": "핵심 개념"}, {"id": "s3-241", "subj": 3, "n": 241, "unit": 20, "a": "X", "s": "부스팅은 개별 모델에 동일한 가중치를 부여하고 병렬로 학습한 뒤 보팅으로 집계한다.", "e": "병렬 학습 + 보팅은 배깅이에요. 부스팅은 오분류 자료에 가중치를 주며 순차적으로 학습해요.", "src": "46·47회 변형"}, {"id": "s3-242", "subj": 3, "n": 242, "unit": 20, "a": "O", "s": "부스팅은 이전 모델이 잘못 분류한 데이터에 가중치를 주며 순차적으로 학습하므로 이상치에 민감하다.", "e": "AdaBoost, GradientBoost, XGBoost, LightGBM이 대표예요.", "src": "핵심 개념"}, {"id": "s3-243", "subj": 3, "n": 243, "unit": 20, "a": "O", "s": "랜덤 포레스트는 배깅에 여러 의사결정나무를 결합하고, 분할할 때 후보 변수도 무작위로 일부만 선택한다.", "e": "나무들을 서로 다르게 만들어 과적합을 줄여요. 대신 해석이 어려워요.", "src": "핵심 개념"}, {"id": "s3-244", "subj": 3, "n": 244, "unit": 20, "a": "X", "s": "SVM의 커널 함수는 고차원 데이터를 저차원으로 변환해 선형 분리한다.", "e": "방향이 반대예요. 커널은 저차원 데이터를 고차원으로 매핑해 선형으로 분리해요.", "src": "49회 변형"}, {"id": "s3-245", "subj": 3, "n": 245, "unit": 20, "a": "O", "s": "SVM은 두 집단 사이의 마진이 최대가 되는 초평면을 찾는다.", "e": "초평면과 가장 가까운 데이터 포인트가 서포트 벡터예요.", "src": "50회 변형"}, {"id": "s3-246", "subj": 3, "n": 246, "unit": 20, "a": "X", "s": "k-NN에서 k가 클수록 과대적합이 발생한다.", "e": "k가 작을수록 과대적합, 클수록 과소적합이에요.", "src": "44회 변형"}, {"id": "s3-247", "subj": 3, "n": 247, "unit": 21, "a": "X", "s": "인공신경망의 모든 은닉층은 항상 동일한 개수의 노드로 구성되어야 한다.", "e": "층마다 노드 수를 다르게 설계해도 돼요.", "src": "46회 변형"}, {"id": "s3-248", "subj": 3, "n": 248, "unit": 21, "a": "O", "s": "인공신경망 입력층의 노드 수는 입력 데이터의 특성(변수) 수와 같다.", "e": "키·몸무게·나이를 쓰면 입력 노드는 3개예요.", "src": "핵심 개념"}, {"id": "s3-249", "subj": 3, "n": 249, "unit": 21, "a": "O", "s": "입력 20개, 은닉 50개, 출력 3개인 완전연결 신경망의 가중치 수(편향 제외)는 1,150개이다.", "e": "20 × 50 + 50 × 3 = 1,000 + 150 = 1,150이에요.", "src": "46회 변형"}, {"id": "s3-250", "subj": 3, "n": 250, "unit": 21, "a": "X", "s": "은닉층이 없는 신경망의 출력에 ReLU 함수를 쓰면 로지스틱 회귀와 같아진다.", "e": "로지스틱 회귀와 같아지는 건 시그모이드를 쓸 때예요. ReLU는 확률을 내놓지 않아요.", "src": "47회 변형"}, {"id": "s3-251", "subj": 3, "n": 251, "unit": 21, "a": "X", "s": "하이퍼볼릭 탄젠트(tanh) 함수의 출력 범위는 0~1이다.", "e": "tanh의 출력 범위는 −1 ~ 1이에요. 0~1은 시그모이드예요.", "src": "50회 변형"}, {"id": "s3-252", "subj": 3, "n": 252, "unit": 21, "a": "O", "s": "시그모이드 함수의 출력 범위는 0~1이다.", "e": "이진 분류 출력에 써요.", "src": "46회 변형"}, {"id": "s3-253", "subj": 3, "n": 253, "unit": 21, "a": "O", "s": "ReLU 함수는 음수 입력은 0으로, 양수 입력은 그대로 출력한다.", "e": "ReLU = max(0, a)예요. 기울기 소실을 완화하고 학습이 빨라요.", "src": "핵심 개념"}, {"id": "s3-254", "subj": 3, "n": 254, "unit": 21, "a": "X", "s": "출력층 결과가 3개 이상의 범주일 때 주로 사용하는 활성화 함수는 ReLU이다.", "e": "다범주 출력층에는 Softmax를 써요.", "src": "46회 변형"}, {"id": "s3-255", "subj": 3, "n": 255, "unit": 21, "a": "O", "s": "소프트맥스 함수의 출력값은 각각 0~1 사이이고 모두 더하면 1이다.", "e": "각 범주에 속할 사후 확률을 알려 줘요.", "src": "47회 변형"}, {"id": "s3-256", "subj": 3, "n": 256, "unit": 21, "a": "X", "s": "기울기 소실은 역전파 과정에서 출력층에 가까울수록 기울기가 작아지는 문제이다.", "e": "입력층 쪽으로 갈수록 기울기가 작아져 가중치가 거의 업데이트되지 않는 문제예요.", "src": "49회 변형"}, {"id": "s3-257", "subj": 3, "n": 257, "unit": 21, "a": "O", "s": "기울기 소실 문제는 활성화 함수를 ReLU로 바꾸면 완화된다.", "e": "은닉층이 많아질수록 기울기 소실과 과대적합 위험이 커져요.", "src": "핵심 개념"}, {"id": "s3-258", "subj": 3, "n": 258, "unit": 22, "a": "O", "s": "오분류표에서 FP는 실제 False인데 True로 예측한 경우로, 1종 오류(헛경보)에 해당한다.", "e": "FN은 실제 True인데 False로 예측한 2종 오류(놓침)예요.", "src": "핵심 개념"}, {"id": "s3-259", "subj": 3, "n": 259, "unit": 22, "a": "X", "s": "오분류표에서 FN은 실제 False인데 True로 예측한 경우이다.", "e": "FN은 실제 True인데 False로 예측한 경우예요. 설명된 것은 FP예요.", "src": "핵심 개념"}, {"id": "s3-260", "subj": 3, "n": 260, "unit": 22, "a": "O", "s": "정확도(Accuracy)는 (TP + TN) ÷ 전체 데이터 수이다.", "e": "오분류율 = 1 − 정확도예요.", "src": "핵심 개념"}, {"id": "s3-261", "subj": 3, "n": 261, "unit": 22, "a": "X", "s": "정밀도(Precision)는 실제 True인 것 중 True로 맞힌 비율이다.", "e": "그건 재현율(민감도)이에요. 정밀도는 True로 예측한 것 중 실제 True의 비율이에요.", "src": "45·46회 변형"}, {"id": "s3-262", "subj": 3, "n": 262, "unit": 22, "a": "O", "s": "재현율(민감도)은 TP ÷ (TP + FN)이다.", "e": "실제 True인 것 중 True로 맞힌 비율이에요.", "src": "46·47회 변형"}, {"id": "s3-263", "subj": 3, "n": 263, "unit": 22, "a": "O", "s": "특이도는 실제 False인 것 중 False로 맞힌 비율로, TN ÷ (TN + FP)이다.", "e": "FP rate = 1 − 특이도예요.", "src": "핵심 개념"}, {"id": "s3-264", "subj": 3, "n": 264, "unit": 22, "a": "X", "s": "F1 score는 정밀도와 재현율의 산술평균이다.", "e": "F1 score는 정밀도와 재현율의 조화평균이에요(2TP / (2TP + FP + FN)).", "src": "48회 변형"}, {"id": "s3-265", "subj": 3, "n": 265, "unit": 22, "a": "O", "s": "TP 60, FN 40, FP 20, TN 80일 때 정확도는 0.70이다.", "e": "(60 + 80) ÷ 200 = 0.70이에요.", "src": "핵심 개념"}, {"id": "s3-266", "subj": 3, "n": 266, "unit": 22, "a": "X", "s": "TP 60, FN 40, FP 20, TN 80일 때 정밀도는 0.60이다.", "e": "정밀도 = 60 ÷ (60 + 20) = 0.75예요. 0.60은 재현율이에요.", "src": "핵심 개념"}, {"id": "s3-267", "subj": 3, "n": 267, "unit": 22, "a": "X", "s": "ROC 커브의 x축은 민감도, y축은 특이도이다.", "e": "x축은 1 − 특이도(FP rate), y축은 민감도(TP rate)예요.", "src": "46회 변형"}, {"id": "s3-268", "subj": 3, "n": 268, "unit": 22, "a": "O", "s": "ROC 커브에서 가장 효율적인 점은 (0, 1)이며, AUC가 0.5이면 무작위 분류와 같은 수준이다.", "e": "AUC는 1에 가까울수록 좋아요.", "src": "45회 변형"}, {"id": "s3-269", "subj": 3, "n": 269, "unit": 22, "a": "X", "s": "범주 불균형이 심한 데이터에서는 정확도만으로 모형을 평가하는 것이 가장 바람직하다.", "e": "환자 1%뿐인 자료에서 모두 정상이라 해도 정확도는 99%예요. F1·재현율·AUC·향상도를 함께 봐요.", "src": "48회 변형"}, {"id": "s3-270", "subj": 3, "n": 270, "unit": 23, "a": "O", "s": "좋은 군집은 군집 내 동질성은 높고 군집 간 이질성도 높다.", "e": "안은 촘촘하게, 사이는 멀게 나뉘어야 해요.", "src": "핵심 개념"}, {"id": "s3-271", "subj": 3, "n": 271, "unit": 23, "a": "X", "s": "입력변수가 범주형이면 군집분석을 할 수 없다.", "e": "범주형 변수는 자카드 계수 같은 유사도를 써서 군집분석할 수 있어요.", "src": "45회 변형"}, {"id": "s3-272", "subj": 3, "n": 272, "unit": 23, "a": "O", "s": "군집분석은 정답 라벨 없이 비슷한 개체끼리 묶는 비지도학습이다.", "e": "군집의 의미는 분석가가 해석해야 해요.", "src": "핵심 개념"}, {"id": "s3-273", "subj": 3, "n": 273, "unit": 23, "a": "X", "s": "계층적 군집분석은 같은 데이터·거리·연결법으로 다시 분석해도 결과가 달라질 수 있다.", "e": "계층적 군집은 결정론적이라 같은 조건이면 결과가 같아요. 초기 중심에 따라 달라지는 건 K-평균이에요.", "src": "46회 변형"}, {"id": "s3-274", "subj": 3, "n": 274, "unit": 23, "a": "O", "s": "계층적 군집은 군집 수를 미리 정하지 않아도 되며, 병합 과정을 덴드로그램으로 볼 수 있다.", "e": "K-평균은 군집 수 k를 먼저 정해요.", "src": "핵심 개념"}, {"id": "s3-275", "subj": 3, "n": 275, "unit": 23, "a": "X", "s": "최단연결법은 두 군집에서 가장 먼 두 개체 사이의 거리로 군집 간 거리를 정의한다.", "e": "가장 먼 두 개체의 거리는 최장(완전)연결법이에요. 최단(단일)연결법은 가장 가까운 두 개체의 거리예요.", "src": "핵심 개념"}, {"id": "s3-276", "subj": 3, "n": 276, "unit": 23, "a": "O", "s": "단일연결법은 최단연결법, 완전연결법은 최장연결법과 같은 방법이다.", "e": "최장연결법은 가장 먼 거리를 기준으로 하여 이상치에 민감해요.", "src": "46회 변형"}, {"id": "s3-277", "subj": 3, "n": 277, "unit": 23, "a": "X", "s": "평균연결법은 군집 내 오차제곱합(SSE)의 증가량이 최소가 되도록 군집을 병합한다.", "e": "SSE 증가량 최소는 와드연결법이에요. 평균연결법은 모든 개체 쌍 거리의 평균을 써요.", "src": "47·48·49회 변형"}, {"id": "s3-278", "subj": 3, "n": 278, "unit": 23, "a": "O", "s": "덴드로그램에서 특정 높이에 수평선을 그었을 때 교차하는 세로선의 수가 그 높이에서의 군집 수이다.", "e": "세로축(Height)은 두 군집이 합쳐진 거리예요.", "src": "45회 변형"}, {"id": "s3-279", "subj": 3, "n": 279, "unit": 23, "a": "X", "s": "덴드로그램은 낮은 높이에서 자를수록 군집 수가 적어진다.", "e": "낮게 자를수록 군집이 많아지고, 높게 자를수록 적어져요.", "src": "핵심 개념"}, {"id": "s3-280", "subj": 3, "n": 280, "unit": 24, "a": "X", "s": "K-means의 군집 수 K는 알고리즘이 자동으로 정해 준다.", "e": "K는 사용자가 직접 지정해요. Elbow Method 등으로 적정 K를 찾아요.", "src": "45회 변형"}, {"id": "s3-281", "subj": 3, "n": 281, "unit": 24, "a": "O", "s": "K-means는 데이터를 가장 가까운 중심에 할당하고 중심을 군집 평균으로 다시 계산하는 과정을 중심 변화가 없을 때까지 반복한다.", "e": "K 지정 → 할당 → 중심 재계산 → 반복이에요.", "src": "핵심 개념"}, {"id": "s3-282", "subj": 3, "n": 282, "unit": 24, "a": "X", "s": "K-means의 결과는 초기 중심값 설정에 영향을 받지 않는다.", "e": "초기 중심값에 민감해서 지역 최적해에 갇힐 수 있어요. K-means++ 등으로 보완해요.", "src": "47회 변형"}, {"id": "s3-283", "subj": 3, "n": 283, "unit": 24, "a": "O", "s": "K-means는 잡음과 이상값에 민감하다.", "e": "이를 보완한 방법으로 K-medoids(PAM)가 있어요.", "src": "핵심 개념"}, {"id": "s3-284", "subj": 3, "n": 284, "unit": 24, "a": "O", "s": "Elbow Method는 K에 따른 군집 내 제곱합(WSS)의 감소폭이 급격히 줄어드는 지점을 적정 K로 본다.", "e": "기출의 '집단 내 제곱합 그래프'가 이 그래프예요.", "src": "44회 변형"}, {"id": "s3-285", "subj": 3, "n": 285, "unit": 24, "a": "X", "s": "실루엣 계수의 범위는 0~1이다.", "e": "실루엣 계수는 −1 ~ 1이고 1에 가까울수록 군집이 잘 나뉜 거예요.", "src": "핵심 개념"}, {"id": "s3-286", "subj": 3, "n": 286, "unit": 24, "a": "O", "s": "DBSCAN은 군집 수를 미리 정하지 않아도 되며, 밀도가 낮은 점은 노이즈로 분류한다.", "e": "U자·반달 같은 비구형 군집도 잘 찾아요.", "src": "47·50회 변형"}, {"id": "s3-287", "subj": 3, "n": 287, "unit": 24, "a": "X", "s": "DBSCAN은 군집 간 거리를 이용해 단계적으로 병합하는 계층적 군집 방법이다.", "e": "DBSCAN은 덴드로그램을 만들지 않는 밀도 기반 비계층적 군집이에요.", "src": "50회 변형"}, {"id": "s3-288", "subj": 3, "n": 288, "unit": 24, "a": "O", "s": "혼합 분포 군집(GMM)은 EM 알고리즘으로 E-step과 M-step을 반복해 모수를 추정한다.", "e": "초기값에 따라 결과가 달라질 수 있어요.", "src": "47회 변형"}, {"id": "s3-289", "subj": 3, "n": 289, "unit": 24, "a": "X", "s": "SOM(자기조직화지도)은 입력층과 경쟁층이 부분적으로(locally) 연결된다.", "e": "SOM의 입력층과 경쟁층은 완전 연결돼요.", "src": "45회 변형"}, {"id": "s3-290", "subj": 3, "n": 290, "unit": 25, "a": "O", "s": "연관규칙 A → B에서 A는 조건(선행), B는 결과(후행)이다.", "e": "'A를 사면 B도 산다'는 If–then 패턴이에요.", "src": "핵심 개념"}, {"id": "s3-291", "subj": 3, "n": 291, "unit": 25, "a": "O", "s": "지지도는 전체 거래 중 A와 B가 동시에 포함된 거래의 비율이다.", "e": "지지도 = P(A∩B)예요.", "src": "45·48회 변형"}, {"id": "s3-292", "subj": 3, "n": 292, "unit": 25, "a": "X", "s": "신뢰도는 전체 거래 중 A와 B를 동시에 포함한 거래의 비율이다.", "e": "그건 지지도예요. 신뢰도는 A를 포함한 거래 중 B도 포함한 비율, P(B|A)예요.", "src": "45·48회 변형"}, {"id": "s3-293", "subj": 3, "n": 293, "unit": 25, "a": "O", "s": "향상도는 신뢰도(A → B)를 B가 포함된 거래의 비율 P(B)로 나눈 값이다.", "e": "향상도 = P(A∩B) / (P(A) × P(B))예요.", "src": "핵심 개념"}, {"id": "s3-294", "subj": 3, "n": 294, "unit": 25, "a": "O", "s": "전체 100건 중 우유만 산 거래 20건, 빵만 산 거래 30건, 둘 다 산 거래 20건이면 '우유 → 빵'의 신뢰도는 0.5이다.", "e": "우유 포함 거래 = 20 + 20 = 40건 → 20 ÷ 40 = 0.5예요. '~만 구매'면 동시 구매분을 더해야 해요.", "src": "44·49회 변형"}, {"id": "s3-295", "subj": 3, "n": 295, "unit": 25, "a": "O", "s": "전체 100건 중 우유 포함 40건, 빵 포함 50건, 둘 다 포함 20건이면 '우유 → 빵'의 향상도는 1이다.", "e": "신뢰도 0.5 ÷ P(빵) 0.5 = 1 → 두 품목은 독립이에요.", "src": "핵심 개념"}, {"id": "s3-296", "subj": 3, "n": 296, "unit": 25, "a": "X", "s": "향상도가 0이면 두 품목은 서로 독립이다.", "e": "독립의 기준은 1이에요. 향상도 > 1 양의 연관, = 1 독립, < 1 음의 연관이에요.", "src": "48회 변형"}, {"id": "s3-297", "subj": 3, "n": 297, "unit": 25, "a": "O", "s": "향상도가 1보다 크면 두 품목 사이에 양의 연관이 있다.", "e": "함께 살 가능성이 우연보다 높다는 뜻이에요.", "src": "핵심 개념"}, {"id": "s3-298", "subj": 3, "n": 298, "unit": 25, "a": "X", "s": "연관규칙의 방향을 A → B에서 B → A로 바꾸어도 신뢰도는 변하지 않는다.", "e": "지지도·향상도는 그대로지만 신뢰도는 분모가 P(A)에서 P(B)로 바뀌어 달라져요.", "src": "50회 변형"}, {"id": "s3-299", "subj": 3, "n": 299, "unit": 25, "a": "X", "s": "Apriori 알고리즘은 2개 품목 조합부터 탐색한 뒤 최소 지지도를 설정한다.", "e": "최소 지지도 설정이 가장 먼저예요. 그다음 개별 품목 → 2개 조합 → … 순서로 탐색해요.", "src": "44회 변형"}, {"id": "s3-300", "subj": 3, "n": 300, "unit": 25, "a": "X", "s": "연관분석은 품목 수가 늘어나도 계산량이 거의 증가하지 않는다.", "e": "품목 수가 늘면 계산량이 기하급수적으로 증가해요. FP-Growth가 이를 보완해요.", "src": "핵심 개념"}];
let UNITS = [], QS = [];
const KEY = "adsp-ox-s1-v1";
let ans = {};
try { ans = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch(e) { ans = {}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(ans)); } catch(e) {} }
let st = { subj: 1, unit: 0, wrong:false, todo:false, review:false, shuffle:false, order:null };

const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function subjBar(){
  const n = $("#subj"); n.innerHTML = "";
  SUBJ.forEach(sj => {
    const b = document.createElement("button");
    b.className = st.subj===sj.no ? "on" : "";
    b.setAttribute("aria-pressed", st.subj===sj.no);
    const qs = ALL.filter(q=>q.subj===sj.no); const k = qs.filter(q=>ans[q.id]===q.a).length;
    b.innerHTML = `<b>${sj.no}과목</b><span>${sj.title} · ${k}/${qs.length}</span>`;
    b.onclick = () => { if (st.subj===sj.no) return; st.subj = sj.no; st.unit = 0; st.order = null; try{localStorage.setItem(KEY+"-subj", sj.no);}catch(e){} render(); };
    n.appendChild(b);
  });
}
function chips(){
  const c = $("#chips"); c.innerHTML = "";
  const mk = (u, label, color, n) => {
    const b = document.createElement("button");
    b.className = "chip" + (st.unit===u ? " on":"");
    b.innerHTML = (color?`<span class="dot" style="background:${color}"></span>`:"") + label + ` <small>${n}</small>`;
    b.onclick = () => { st.unit = u; st.order = null; render(); window.scrollTo({top: $("#list").offsetTop - 10, behavior:"smooth"}); };
    c.appendChild(b);
  };
  mk(0, "전체", null, QS.length);
  UNITS.forEach(u => mk(u.no, `단원 ${u.no}`, u.color, QS.filter(q=>q.unit===u.no).length));
}

function stats(){
  let done=0, ok=0;
  QS.forEach(q => { if (ans[q.id]) { done++; if (ans[q.id]===q.a) ok++; } });
  $("#sCorrect").textContent = ok; $("#sDone").textContent = done; $("#sTotal").textContent = QS.length;
  $("#sRate").textContent = done ? Math.round(ok/done*100)+"%" : "–";
  $("#bOk").style.width = (ok/QS.length*100)+"%"; $("#bNg").style.width = ((done-ok)/QS.length*100)+"%";

}

function card(q){
  const a = ans[q.id];
  const el = document.createElement("article");
  const state = a ? (a===q.a ? "ok":"ng") : (st.review ? "rev" : "");
  el.className = "q " + state;
  const showAns = a || st.review;
  const btn = v => {
    const cls = ["ox", v.toLowerCase()];
    if (a===v) cls.push("picked");
    if (showAns && q.a===v) cls.push("answer");
    return `<button class="${cls.join(" ")}" data-v="${v}" ${a?"disabled":""} aria-label="${v==="O"?"맞다(O)":"틀리다(X)"}">${v}</button>`;
  };
  const verdict = a ? (a===q.a ? "정답!" : "아쉬워요") : "정답";
  el.innerHTML = `<div class="row"><div class="num">${q.n}</div><div class="stmt">${esc(q.s)}</div></div>
    <div class="btns">${btn("O")}${btn("X")}</div>
    <div class="fb ${showAns?"show":""}"><span class="verdict">${verdict}</span>정답 <b>${q.a}</b> · ${esc(q.e)}<br><span class="src">출처 : ${esc(q.src)}</span></div>`;
  el.querySelectorAll(".ox").forEach(b => b.onclick = () => { ans[q.id] = b.dataset.v; save(); const n = card(q); el.replaceWith(n); stats(); subjBar(); });
  return el;
}

function render(){
  const sj = SUBJ.find(x=>x.no===st.subj);
  UNITS = sj.units; QS = ALL.filter(q=>q.subj===st.subj);
  subjBar(); stats();
  const list = $("#list"); list.innerHTML = "";
  ["tWrong","tTodo","tReview","tShuffle"].forEach(id => {
    const on = {tWrong:st.wrong,tTodo:st.todo,tReview:st.review,tShuffle:st.shuffle}[id];
    const b = $("#"+id); b.classList.toggle("on", on); b.setAttribute("aria-pressed", on);
  });
  $("#tReset").textContent = st.unit ? `단원 ${st.unit} 다시 풀기` : `${st.subj}과목 전체 다시 풀기`;
  let qs = QS.filter(q => !st.unit || q.unit===st.unit);
  if (st.wrong) qs = qs.filter(q => ans[q.id] && ans[q.id]!==q.a);
  if (st.todo) qs = qs.filter(q => !ans[q.id]);
  if (!qs.length){ list.innerHTML = `<div class="empty">${st.wrong?"틀린 문제가 없어요. 잘했어요!":"보여 줄 문제가 없어요."}</div>`; return; }
  if (st.shuffle){
    if (!st.order) { st.order = {}; qs.forEach(q => st.order[q.id] = Math.random()); }
    qs = qs.slice().sort((a,b) => (st.order[a.id]??0) - (st.order[b.id]??0));
    qs.forEach(q => list.appendChild(card(q)));
    return;
  }
  UNITS.forEach(u => {
    const sub = qs.filter(q=>q.unit===u.no); if (!sub.length) return;
    const h = document.createElement("div"); h.className = "unit-head";
    const total = QS.filter(q=>q.unit===u.no).length;
    h.innerHTML = `<span class="tag" style="background:${u.color}">단원 ${u.no}</span><h2>${esc(u.title)}</h2><span class="cnt">${total}문항</span>`;
    list.appendChild(h);
    sub.forEach(q => list.appendChild(card(q)));
  });
}
$("#tWrong").onclick = () => { st.wrong = !st.wrong; if (st.wrong) st.todo=false; render(); };
$("#tTodo").onclick = () => { st.todo = !st.todo; if (st.todo) st.wrong=false; render(); };
$("#tReview").onclick = () => { st.review = !st.review; render(); };
$("#tShuffle").onclick = () => { st.shuffle = !st.shuffle; st.order = null; render(); };
$("#tReset").onclick = () => {
  QS.forEach(q => { if (!st.unit || q.unit===st.unit) delete ans[q.id]; });
  save(); st.wrong=false; st.order=null; render();
};
try { const v = +localStorage.getItem(KEY+"-subj"); if (SUBJ.some(x=>x.no===v)) st.subj = v; } catch(e) {}
render();
</script>
</body>
</html>
